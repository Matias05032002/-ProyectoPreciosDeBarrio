<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro — BarrioPrecios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body>

<!-- Fondo mapa -->
<div th:replace="~{fragmentos/mapa-svg :: mapa}"></div>
<div class="map-overlay"></div>

<div class="card">

  <div class="card-header">
    <div class="brand-bar">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="white" width="18" height="18">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
      </div>
      <div class="brand-text">BarrioPrecios <span>Red de precios del barrio</span></div>
    </div>
    <div class="form-title">Crear cuenta</div>
    <div class="form-sub">Elegí tu tipo de cuenta para continuar</div>

    <!-- Toggle usuario / comercio -->
    <div class="tabs" id="tipo-tabs">
      <a class="tab active" id="tab-usuario" href="#" onclick="switchTab('usuario'); return false;">&#128100; Vecino</a>
      <a class="tab" id="tab-comercio" href="#" onclick="switchTab('comercio'); return false;">&#127978; Comercio</a>
    </div>
  </div>

  <!-- FORMULARIO USUARIO -->
  <form id="form-usuario" action="#" th:action="@{/registrarme}" method="POST">
    <input type="hidden" name="rol" value="USER">

    <div class="card-body">
      <div th:if="${error != null}" class="error-msg" th:text="${error}"></div>

      <div class="row-2">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Juan" required>
        </div>
        <div class="field">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" placeholder="García" required>
        </div>
      </div>

      <div class="field">
        <label for="localidad-u">Localidad</label>
        <div class="select-wrap">
          <select id="localidad-u" name="localidad" required>
            <option value="">Seleccionar partido/localidad</option>
            <option value="Almirante Brown">Almirante Brown</option>
            <option value="Avellaneda">Avellaneda</option>
            <option value="Bahia Blanca">Bahía Blanca</option>
            <option value="Berazategui">Berazategui</option>
            <option value="Berisso">Berisso</option>
            <option value="Brandsen">Brandsen</option>
            <option value="Buenos Aires">Buenos Aires (CABA)</option>
            <option value="Campana">Campana</option>
            <option value="Canuelas">Cañuelas</option>
            <option value="Ensenada">Ensenada</option>
            <option value="Escobar">Escobar</option>
            <option value="Esteban Echeverria">Esteban Echeverría</option>
            <option value="Exaltacion de la Cruz">Exaltación de la Cruz</option>
            <option value="Ezeiza">Ezeiza</option>
            <option value="Florencio Varela">Florencio Varela</option>
            <option value="General Las Heras">General Las Heras</option>
            <option value="General Rodriguez">General Rodríguez</option>
            <option value="Hurlingham">Hurlingham</option>
            <option value="Ituzaingo">Ituzaingó</option>
            <option value="Jose C. Paz">José C. Paz</option>
            <option value="La Matanza">La Matanza</option>
            <option value="La Plata">La Plata</option>
            <option value="Lanus">Lanús</option>
            <option value="Lobos">Lobos</option>
            <option value="Lomas de Zamora">Lomas de Zamora</option>
            <option value="Lujan">Luján</option>
            <option value="Magdalena">Magdalena</option>
            <option value="Malvinas Argentinas">Malvinas Argentinas</option>
            <option value="Mar del Plata">Mar del Plata</option>
            <option value="Marcos Paz">Marcos Paz</option>
            <option value="Merlo">Merlo</option>
            <option value="Moreno">Moreno</option>
            <option value="Moron">Morón</option>
            <option value="Navarro">Navarro</option>
            <option value="Pilar">Pilar</option>
            <option value="Presidente Peron">Presidente Perón</option>
            <option value="Punta Indio">Punta Indio</option>
            <option value="Quilmes">Quilmes</option>
            <option value="Ramallo">Ramallo</option>
            <option value="San Fernando">San Fernando</option>
            <option value="San Isidro">San Isidro</option>
            <option value="San Martin">San Martín</option>
            <option value="San Miguel">San Miguel</option>
            <option value="San Nicolas">San Nicolás</option>
            <option value="San Vicente">San Vicente</option>
            <option value="Tigre">Tigre</option>
            <option value="Tres de Febrero">Tres de Febrero</option>
            <option value="Vicente Lopez">Vicente López</option>
            <option value="Zarate">Zárate</option>
          </select>
        </div>
      </div>

      <div class="section-label">Acceso</div>

      <div class="field">
        <label for="email-u">Email</label>
        <input type="email" id="email-u" name="email" placeholder="juan@correo.com" required>
      </div>

      <div class="field">
        <label for="password-u">Contraseña</label>
        <input type="password" id="password-u" name="password" placeholder="Mínimo 8 caracteres" required>
        <div class="strength-bar"><div class="strength-seg"></div><div class="strength-seg"></div><div class="strength-seg"></div><div class="strength-seg"></div></div>
        <div class="pass-hint">Mínimo 8 caracteres y al menos una mayúscula</div>
      </div>
    </div>

    <div class="card-footer">
      <button type="submit" class="btn-primary">Crear cuenta como Vecino</button>
      <div class="bottom-link">¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a></div>
    </div>
  </form>

  <!-- FORMULARIO COMERCIO -->
  <form id="form-comercio" action="#" th:action="@{/registrarme-comercio}" method="POST" style="display:none;">

    <div class="card-body">
      <div th:if="${errorComercio != null}" class="error-msg" th:text="${errorComercio}"></div>

      <div class="field">
        <label for="nombre-comercio">Nombre del comercio</label>
        <input type="text" id="nombre-comercio" name="nombre" placeholder="Ej: Almacén Don José" required>
      </div>

      <div class="field">
        <label for="tipo-comercio">Tipo de comercio</label>
        <div class="select-wrap">
          <select id="tipo-comercio" name="tipo" required>
            <option value="" disabled selected>Seleccioná el tipo</option>
            <option value="Almacen">Almacén</option>
            <option value="Verduleria">Verdulería</option>
            <option value="Carniceria">Carnicería</option>
            <option value="Kiosco">Kiosco</option>
            <option value="Supermercado">Supermercado</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="direccion-c">Dirección</label>
        <input type="text" id="direccion-c" name="direccion" placeholder="Ej: Av. Rivadavia 1234" required>
      </div>

      <div class="field">
        <label for="localidad-c">Localidad</label>
        <div class="select-wrap">
          <select id="localidad-c" name="localidad" required>
            <option value="">Seleccionar partido/localidad</option>
            <option value="Almirante Brown">Almirante Brown</option>
            <option value="Avellaneda">Avellaneda</option>
            <option value="Bahia Blanca">Bahía Blanca</option>
            <option value="Berazategui">Berazategui</option>
            <option value="Berisso">Berisso</option>
            <option value="Brandsen">Brandsen</option>
            <option value="Buenos Aires">Buenos Aires (CABA)</option>
            <option value="Campana">Campana</option>
            <option value="Canuelas">Cañuelas</option>
            <option value="Ensenada">Ensenada</option>
            <option value="Escobar">Escobar</option>
            <option value="Esteban Echeverria">Esteban Echeverría</option>
            <option value="Exaltacion de la Cruz">Exaltación de la Cruz</option>
            <option value="Ezeiza">Ezeiza</option>
            <option value="Florencio Varela">Florencio Varela</option>
            <option value="General Las Heras">General Las Heras</option>
            <option value="General Rodriguez">General Rodríguez</option>
            <option value="Hurlingham">Hurlingham</option>
            <option value="Ituzaingo">Ituzaingó</option>
            <option value="Jose C. Paz">José C. Paz</option>
            <option value="La Matanza">La Matanza</option>
            <option value="La Plata">La Plata</option>
            <option value="Lanus">Lanús</option>
            <option value="Lobos">Lobos</option>
            <option value="Lomas de Zamora">Lomas de Zamora</option>
            <option value="Lujan">Luján</option>
            <option value="Magdalena">Magdalena</option>
            <option value="Malvinas Argentinas">Malvinas Argentinas</option>
            <option value="Mar del Plata">Mar del Plata</option>
            <option value="Marcos Paz">Marcos Paz</option>
            <option value="Merlo">Merlo</option>
            <option value="Moreno">Moreno</option>
            <option value="Moron">Morón</option>
            <option value="Navarro">Navarro</option>
            <option value="Pilar">Pilar</option>
            <option value="Presidente Peron">Presidente Perón</option>
            <option value="Punta Indio">Punta Indio</option>
            <option value="Quilmes">Quilmes</option>
            <option value="Ramallo">Ramallo</option>
            <option value="San Fernando">San Fernando</option>
            <option value="San Isidro">San Isidro</option>
            <option value="San Martin">San Martín</option>
            <option value="San Miguel">San Miguel</option>
            <option value="San Nicolas">San Nicolás</option>
            <option value="San Vicente">San Vicente</option>
            <option value="Tigre">Tigre</option>
            <option value="Tres de Febrero">Tres de Febrero</option>
            <option value="Vicente Lopez">Vicente López</option>
            <option value="Zarate">Zárate</option>
          </select>
        </div>
      </div>

      <div class="section-label">Acceso</div>

      <div class="field">
        <label for="email-c">Email</label>
        <input type="email" id="email-c" name="email" placeholder="comercio@correo.com" required>
      </div>

      <div class="field">
        <label for="password-c">Contraseña</label>
        <input type="password" id="password-c" name="password" placeholder="Mínimo 8 caracteres" required>
        <div class="strength-bar"><div class="strength-seg"></div><div class="strength-seg"></div><div class="strength-seg"></div><div class="strength-seg"></div></div>
        <div class="pass-hint">Mínimo 8 caracteres y al menos una mayúscula</div>
      </div>
    </div>

    <div class="card-footer">
      <button type="submit" class="btn-primary">Registrar comercio</button>
      <div class="bottom-link">¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a></div>
    </div>
  </form>

</div>

<script>
  function switchTab(tipo) {
    const formU = document.getElementById('form-usuario');
    const formC = document.getElementById('form-comercio');
    const tabU  = document.getElementById('tab-usuario');
    const tabC  = document.getElementById('tab-comercio');

    if (tipo === 'usuario') {
      formU.style.display = 'flex';
      formC.style.display = 'none';
      tabU.classList.add('active');
      tabC.classList.remove('active');
    } else {
      formU.style.display = 'none';
      formC.style.display = 'flex';
      tabC.classList.add('active');
      tabU.classList.remove('active');
    }
  }
</script>

<th:block th:if="${errorComercio != null}">
  <script>switchTab('comercio');</script>
</th:block>

</body>
</html>
