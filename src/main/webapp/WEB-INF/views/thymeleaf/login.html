<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Mapa de Precios</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<!-- Mapa como fondo full pantalla -->
<div th:replace="~{fragmentos/mapa-svg :: mapa}"></div>
<div class="map-overlay"></div>

<!-- Card del formulario -->
<div class="card">
    <div class="brand-bar">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="white" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
        </div>
        <div class="brand-text">
            Mapa de Precios
            <span>Barrio · Comunidad</span>
        </div>
    </div>

    <div class="form-title">¡Hola, vecino!</div>
    <div class="form-sub">Accedé o creá tu cuenta</div>

    <div class="live-badge">
        <span class="green-dot"></span> 340 vecinos activos ahora
    </div>

    <div class="tabs">
        <a class="tab active" th:href="@{/login}">Ingresar</a>
        <a class="tab" id="btn-register" th:href="@{/nuevo-usuario}">Registrarme</a>
    </div>

    <p th:if="${error != null}" class="alert alert-danger" th:text="${error}"></p>

    <form th:action="@{/validar-login}" th:object="${datosLogin}" method="post">
        <div class="field">
            <label>Email</label>
            <input type="email" th:field="*{email}" id="email" placeholder="vos@barrio.com">
        </div>
        <div class="field">
            <label>Contraseña</label>
            <input type="password" th:field="*{password}" id="password" placeholder="••••••••">
        </div>

        <div class="forgot"><a href="#">¿Olvidaste tu contraseña?</a></div>

        <button type="submit" id="btn-login" class="btn-primary">Entrar al barrio →</button>
    </form>

    <div class="bottom-link">
        ¿Primera vez? <a th:href="@{/nuevo-usuario}">Registrate gratis</a>
    </div>
</div>

</body>
</html>
