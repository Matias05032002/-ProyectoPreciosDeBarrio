<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notificaciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <style>
        .no-lista { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 6rem; }
        .no-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
        .no-cabecera h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800; color: #0B1B2B; }
        .no-item { display: flex; align-items: stretch; margin: 0 0 .5rem; background: #fff; border: 1px solid #DDE4E8; border-radius: 10px; overflow: hidden; }
        .no-item.no-nueva { border-color: #138A57; background: #F1FAF5; }
        .no-item form { display: block; flex: 1; margin: 0; }
        .no-boton { display: block; width: 100%; min-height: 44px; padding: .8rem 1rem; text-align: left; background: none; border: 0; color: #0B1B2B; }
        .no-boton:hover { background: rgba(19, 138, 87, .08); }
        .no-fecha { display: block; margin-top: .2rem; font-size: .85rem; color: #4A5964; }
        .no-vacio { padding: 2rem 1rem; text-align: center; color: #4A5964; }
    </style>
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<main class="no-lista">
    <div class="no-cabecera">
        <h1>Notificaciones</h1>
        <form th:if="${!notificaciones.isEmpty()}" th:action="@{/notificaciones/leer-todas}" method="post">
            <button type="submit" class="btn btn-outline-success">Marcar todas como leídas</button>
        </form>
    </div>

    <p th:if="${notificaciones.isEmpty()}" class="no-vacio">Todavía no tenés avisos. Cuando pase algo importante, lo vas a ver acá.</p>

    <ul class="list-unstyled" th:if="${!notificaciones.isEmpty()}">
        <li th:each="n : ${notificaciones}" class="no-item" th:classappend="${!n.leida} ? 'no-nueva'">
            <form th:action="@{/notificaciones/{id}/leer(id=${n.id})}" method="post">
                <button type="submit" class="no-boton">
                    <span th:text="${n.mensaje}">Mensaje</span>
                    <span class="no-fecha" th:text="${#temporals.format(n.fechaCreacion, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</span>
                </button>
            </form>
        </li>
    </ul>
</main>

<div th:replace="~{don-peso :: don-peso}"></div>
</body>
</html>
