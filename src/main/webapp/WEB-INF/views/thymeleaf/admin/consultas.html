<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consultas recibidas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>

<nav th:replace="~{navbar :: navbar}"></nav>

<main class="container mt-5">
    <h1>Consultas recibidas</h1>

    <div th:if="${#lists.isEmpty(consultas)}" class="alert alert-info">
        Todavía no hay consultas recibidas.
    </div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(consultas)}">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Asunto</th>
                <th>Mensaje</th>
                <th>Fecha</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="consulta : ${consultas}">
                <td th:text="${consulta.nombre}"></td>
                <td th:text="${consulta.email}"></td>
                <td th:text="${consulta.asunto}"></td>
                <td th:text="${consulta.mensaje}"></td>
                <td th:text="${consulta.fecha}"></td>
                <td th:text="${consulta.estado}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{don-peso :: don-peso}"></div>
</body>
</html>
