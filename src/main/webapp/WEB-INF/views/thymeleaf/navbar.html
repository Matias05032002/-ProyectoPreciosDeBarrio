<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/home}">Mapa de Precios</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarOpciones"
                aria-controls="navbarOpciones"
                aria-expanded="false"
                aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarOpciones">
            <div class="navbar-nav ms-auto align-items-lg-center">

                <!-- Links para usuario VECINO (o sin sesión) -->
                <th:block th:if="${session['ROL'] != 'COMERCIO'}">
                    <a class="nav-link" th:href="@{/producto}">Productos</a>
                    <a class="nav-link" th:href="@{/comercio}">Comercios</a>
                    <a class="nav-link" th:href="@{/reporte}">Reportes</a>
                    <a class="nav-link" th:if="${session['ROL'] != null}" th:href="@{/mis-listas}">Mis listas</a>
                </th:block>

                <!-- Links para usuario COMERCIO -->
                <th:block th:if="${session['ROL'] == 'COMERCIO'}">
                    <a class="nav-link" th:href="@{/reporte/mis-productos}">Mis productos</a>
                    <a class="nav-link" th:href="@{/comercio/perfil}">Mi perfil</a>
                    <a class="nav-link" th:href="@{/reporte}">Reportar producto</a>
                </th:block>

                <a th:if="${session['ROL'] == null}"
                   class="nav-link" th:href="@{/login}">Iniciar sesión</a>

                <a th:if="${session['ROL'] == null}"
                   class="nav-link" th:href="@{/nuevo-usuario}">Registrarse</a>

                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                       href="#"
                       id="menuOpciones"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">
                        Opciones
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end"
                        aria-labelledby="menuOpciones">
                        <li>
                            <a class="dropdown-item" th:href="@{/sobre-la-app}">Sobre la app</a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/feedback}">Dar feedback</a>
                        </li>
                        <li th:if="${session['ROL'] == 'ADMIN'}">
                            <a class="dropdown-item" th:href="@{/admin/consultas}">Consultas recibidas</a>
                        </li>
                        <li th:if="${session['ROL'] != null}">
                            <hr class="dropdown-divider">
                        </li>
                        <li th:if="${session['ROL'] != null}">
                            <a class="dropdown-item" th:href="@{/logout}">Cerrar sesión</a>
                        </li>
                    </ul>
                </div>

                <span th:if="${session['ROL'] != null}"
                      class="nav-link text-secondary"
                      th:text="${session['EMAIL']}">
                </span>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
