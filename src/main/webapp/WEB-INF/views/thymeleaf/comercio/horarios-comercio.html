<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Horarios de atención — Precios de Barrio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/comercio-panel.css}" />
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<header class="cm-cabecera">
    <div class="container">
        <div class="cm-cabecera-fila">
            <div class="cm-cabecera-texto">
                <p class="cm-sobretitulo"><i class="bi bi-shop" aria-hidden="true"></i> Mi comercio</p>
                <h1 id="titulo-pagina">Horarios de atención</h1>
                <p class="cm-subtitulo">Indicá qué días y en qué horarios está abierto tu comercio. Los vecinos ven si estás abierto ahora.</p>
            </div>
            <div class="cm-cabecera-acciones">
                <a th:href="@{/comercio/perfil}" class="cm-btn cm-btn-neutro">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al perfil
                </a>
            </div>
        </div>
    </div>
</header>

<main class="container cm-principal" style="max-width: 820px;">

    <div th:if="${param.guardado}" class="cm-alerta cm-alerta-ok" role="status" id="alerta-horarios-guardados">
        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
        <div class="cm-alerta-texto">Horarios guardados correctamente.</div>
        <button type="button" class="cm-alerta-cerrar" aria-label="Cerrar aviso"
                onclick="this.parentElement.remove()"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </div>

    <form th:action="@{/comercio/perfil/horarios}" method="POST" class="cm-tarjeta">
        <ul class="cm-horarios">
            <li th:each="horario : ${horarios}" class="cm-dia"
                th:classappend="${horario.abierto} ? 'cm-dia-abierto' : ''"
                th:id="'dia_' + ${horario.diaSemana}">

                <div class="cm-dia-cabecera">
                    <span class="cm-interruptor-area">
                        <input class="cm-interruptor horario-toggle"
                               type="checkbox"
                               role="switch"
                               th:name="'abierto_' + ${horario.diaSemana}"
                               th:id="'sw_' + ${horario.diaSemana}"
                               th:checked="${horario.abierto}"
                               th:data-dia="${horario.diaSemana}"
                               th:attr="aria-label=|${horario.nombreDia}: abierto|">
                    </span>
                    <label class="cm-dia-nombre" th:for="'sw_' + ${horario.diaSemana}" th:text="${horario.nombreDia}">Lunes</label>
                    <span class="cm-dia-estado" th:id="'estado_' + ${horario.diaSemana}"
                          th:text="${horario.abierto} ? 'Abierto' : 'Cerrado'">Cerrado</span>
                </div>

                <div class="cm-dia-campos" th:id="'horario_campos_' + ${horario.diaSemana}">
                    <div class="cm-hora">
                        <span>Desde</span>
                        <input type="time" class="cm-control js-selector"
                               th:name="'apertura_' + ${horario.diaSemana}"
                               th:value="${horario.horaApertura}">
                    </div>
                    <div class="cm-hora">
                        <span>Hasta</span>
                        <input type="time" class="cm-control js-selector"
                               th:name="'cierre_' + ${horario.diaSemana}"
                               th:value="${horario.horaCierre}">
                    </div>
                </div>
            </li>
        </ul>

        <div class="cm-acciones cm-barra-guardar">
            <button type="submit" id="btn-guardar-horarios" class="cm-btn cm-btn-principal">
                <i class="bi bi-check2" aria-hidden="true"></i> Guardar horarios
            </button>
            <a th:href="@{/comercio/perfil}" class="cm-btn cm-btn-neutro">Cancelar</a>
        </div>
    </form>

</main>

<script>
    function actualizarCampos(checkbox) {
        var dia = checkbox.dataset.dia;
        var campos = document.getElementById('horario_campos_' + dia);
        var fila = document.getElementById('dia_' + dia);
        var estado = document.getElementById('estado_' + dia);
        campos.style.opacity = checkbox.checked ? '1' : '0.4';
        campos.querySelectorAll('input[type="time"]').forEach(function (inp) {
            inp.disabled = !checkbox.checked;
        });
        fila.classList.toggle('cm-dia-abierto', checkbox.checked);
        estado.textContent = checkbox.checked ? 'Abierto' : 'Cerrado';
    }

    document.querySelectorAll('.horario-toggle').forEach(function (sw) {
        actualizarCampos(sw);
        sw.addEventListener('change', function () { actualizarCampos(this); });
    });
</script>

<script th:src="@{/js/selector-fecha-hora.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{don-peso :: don-peso}"></div>
</body>
</html>
