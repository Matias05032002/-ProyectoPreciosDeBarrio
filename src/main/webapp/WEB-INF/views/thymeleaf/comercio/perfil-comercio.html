<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Mi Comercio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>

<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<main role="main" class="container mt-5">

    <!-- Si no tiene comercio registrado: mostrar formulario -->
    <div th:if="${comercio == null}">
        <h2><i class="bi bi-shop"></i> Registrá tu comercio</h2>
        <p class="text-muted">Completá los datos de tu local para aparecer en el mapa.</p>
        <hr>
        <form th:action="@{/comercio/perfil}" method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre del comercio</label>
                <input type="text" name="nombre" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo</label>
                <select name="tipo" class="form-select" required>
                    <option value="">Seleccioná un tipo...</option>
                    <option value="Almacen">Almacen</option>
                    <option value="Verduleria">Verduleria</option>
                    <option value="Carniceria">Carniceria</option>
                    <option value="Kiosco">Kiosco</option>
                    <option value="Supermercado">Supermercado</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Dirección</label>
                <input type="text" name="direccion" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Localidad</label>
                <select name="localidad" class="form-select" required>
                    <option value="">Seleccionar partido/localidad</option>
                    <option value="Almirante Brown">Almirante Brown</option>
                    <option value="Avellaneda">Avellaneda</option>
                    <option value="Bahia Blanca">Bahía Blanca</option>
                    <option value="Berazategui">Berazategui</option>
                    <option value="Berisso">Berisso</option>
                    <option value="Brandsen">Brandsen</option>
                    <option value="Buenos Aires">Buenos Aires (CABA)</option>
                    <option value="Campana">Campana</option>
                    <option value="Canuelas">Cañuelas</option>
                    <option value="Ensenada">Ensenada</option>
                    <option value="Escobar">Escobar</option>
                    <option value="Esteban Echeverria">Esteban Echeverría</option>
                    <option value="Exaltacion de la Cruz">Exaltación de la Cruz</option>
                    <option value="Ezeiza">Ezeiza</option>
                    <option value="Florencio Varela">Florencio Varela</option>
                    <option value="General Las Heras">General Las Heras</option>
                    <option value="General Rodriguez">General Rodríguez</option>
                    <option value="Hurlingham">Hurlingham</option>
                    <option value="Ituzaingo">Ituzaingó</option>
                    <option value="Jose C. Paz">José C. Paz</option>
                    <option value="La Matanza">La Matanza</option>
                    <option value="La Plata">La Plata</option>
                    <option value="Lanus">Lanús</option>
                    <option value="Lobos">Lobos</option>
                    <option value="Lomas de Zamora">Lomas de Zamora</option>
                    <option value="Lujan">Luján</option>
                    <option value="Magdalena">Magdalena</option>
                    <option value="Malvinas Argentinas">Malvinas Argentinas</option>
                    <option value="Mar del Plata">Mar del Plata</option>
                    <option value="Marcos Paz">Marcos Paz</option>
                    <option value="Merlo">Merlo</option>
                    <option value="Moreno">Moreno</option>
                    <option value="Moron">Morón</option>
                    <option value="Navarro">Navarro</option>
                    <option value="Pilar">Pilar</option>
                    <option value="Presidente Peron">Presidente Perón</option>
                    <option value="Punta Indio">Punta Indio</option>
                    <option value="Quilmes">Quilmes</option>
                    <option value="Ramallo">Ramallo</option>
                    <option value="San Fernando">San Fernando</option>
                    <option value="San Isidro">San Isidro</option>
                    <option value="San Martin">San Martín</option>
                    <option value="San Miguel">San Miguel</option>
                    <option value="San Nicolas">San Nicolás</option>
                    <option value="San Vicente">San Vicente</option>
                    <option value="Tigre">Tigre</option>
                    <option value="Tres de Febrero">Tres de Febrero</option>
                    <option value="Vicente Lopez">Vicente López</option>
                    <option value="Zarate">Zárate</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Guardar comercio</button>
        </form>
    </div>

    <!-- Si ya tiene comercio: mostrar datos -->
    <div th:if="${comercio != null}">
        <h2><i class="bi bi-shop"></i> Mi comercio</h2>
        <hr>
        <dl class="row">
            <dt class="col-sm-3">Nombre</dt>
            <dd class="col-sm-9" th:text="${comercio.nombre}"></dd>

            <dt class="col-sm-3">Tipo</dt>
            <dd class="col-sm-9" th:text="${comercio.tipo}"></dd>

            <dt class="col-sm-3">Dirección</dt>
            <dd class="col-sm-9" th:text="${comercio.direccion}"></dd>

            <dt class="col-sm-3">Localidad</dt>
            <dd class="col-sm-9" th:text="${comercio.localidad}"></dd>

            <dt class="col-sm-3">Descripción</dt>
            <dd class="col-sm-9" th:text="${comercio.descripcion}"></dd>
        </dl>
        <a th:href="@{/comercio/{id}(id=${comercio.id})}" class="btn btn-outline-primary">
            <i class="bi bi-eye"></i> Ver página pública
        </a>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
<div th:replace="~{don-peso :: don-peso}"></div>
</body>
</html>
