<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis promociones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 id="titulo-pagina" class="mb-1">Mis promociones</h1>
            <p class="text-muted mb-0">Creá y administrá las promociones de tu comercio.</p>
        </div>
        <a th:href="@{/comercio/dashboard}" class="btn btn-outline-primary">Volver al dashboard</a>
    </div>

    <div th:if="${error}" class="alert alert-danger" role="alert" id="error-promocion" th:text="${error}"></div>

    <section class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
            <h2 class="h4 mb-4">Crear promoción</h2>

            <form th:action="@{/promociones/crear}" th:object="${promocion}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="titulo" class="form-label">Título</label>
                    <input id="titulo" type="text" th:field="*{titulo}" class="form-control" maxlength="100" required>
                </div>
                <div class="col-md-6">
                    <label for="precioPromocional" class="form-label">Precio promocional</label>
                    <input id="precioPromocional" type="number" th:field="*{precioPromocional}"
                           class="form-control" min="0.01" max="10000000" step="0.01" required>
                </div>
                <div class="col-12">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea id="descripcion" th:field="*{descripcion}" class="form-control" rows="3" maxlength="500"></textarea>
                </div>
                <div class="col-md-6">
                    <label for="fechaInicio" class="form-label">Fecha de inicio</label>
                    <input id="fechaInicio" type="datetime-local" th:field="*{fechaInicio}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label for="fechaFin" class="form-label">Fecha de finalización</label>
                    <input id="fechaFin" type="datetime-local" th:field="*{fechaFin}" class="form-control" required>
                </div>
                <div class="col-12">
                    <button type="submit" id="btn-crear-promocion" class="btn btn-primary">Crear promoción</button>
                </div>
            </form>
        </div>
    </section>

    <section>
        <h2 class="h4 mb-3">Promociones registradas</h2>
        <div th:if="${#lists.isEmpty(promociones)}" id="mensaje-sin-promociones" class="alert alert-info">
            Todavía no tenés promociones registradas.
        </div>

        <div class="row g-3">
            <article th:each="item : ${promociones}" th:id="'card-promocion-' + ${item.id}" class="col-md-6">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <div class="d-flex justify-content-between gap-2 mb-2">
                            <h3 class="h5 mb-0" th:id="'titulo-promocion-' + ${item.id}" th:text="${item.titulo}"></h3>
                            <span class="badge" th:id="'estado-promocion-' + ${item.id}" th:classappend="${item.activa ? ' text-bg-success' : ' text-bg-secondary'}"
                                  th:text="${item.activa ? 'Activa' : 'Inactiva'}"></span>
                        </div>
                        <p class="text-muted" th:text="${item.descripcion}"></p>
                        <p class="mb-1">Precio promocional:
                            <strong th:text="${'$' + #numbers.formatDecimal(item.precioPromocional, 1, 'POINT', 2, 'COMMA')}"></strong></p>
                        <p class="text-muted small mb-3">
                            Del <span th:text="${#temporals.format(item.fechaInicio, 'dd/MM/yyyy HH:mm')}"></span>
                            al <span th:text="${#temporals.format(item.fechaFin, 'dd/MM/yyyy HH:mm')}"></span>
                        </p>
                        <form th:if="${item.activa}" th:action="@{/promociones/{id}/desactivar(id=${item.id})}" method="post">
                            <button type="submit" th:id="'btn-desactivar-promocion-' + ${item.id}" class="btn btn-outline-danger btn-sm">Desactivar promoción</button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
