<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <h2>Comercio encontrado</h2>
    <a th:href="@{/comercio}" class="btn btn-outline-secondary mb-3">Volver</a>
    <table class="table table-bordered mt-2">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Localidad</th>
            <th>Tipo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${comercio != null}">
            <td th:text="${comercio.nombre}"></td>
            <td th:text="${comercio.direccion}"></td>
            <td th:text="${comercio.localidad}"></td>
            <td th:text="${comercio.tipo}"></td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
