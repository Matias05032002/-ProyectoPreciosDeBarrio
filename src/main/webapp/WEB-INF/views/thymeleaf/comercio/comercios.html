<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Comercio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <a th:href="@{/comercio}" class="btn btn-outline-secondary mb-3">Volver</a>

    <div th:if="${comercio != null}">
        <h2 th:text="${comercio.nombre}"></h2>
        <p class="text-muted mb-1">
            <span th:text="${comercio.tipo}"></span> &middot;
            <span th:text="${comercio.localidad}"></span>
        </p>
        <p th:text="${comercio.direccion}"></p>

        <hr>

        <h4 class="mt-4">Productos reportados</h4>

        <div th:if="${#lists.isEmpty(reportes)}" class="alert alert-info mt-3">
            No hay productos reportados para este comercio.
        </div>

        <table th:if="${not #lists.isEmpty(reportes)}" class="table table-bordered mt-3">
            <thead class="table-dark">
            <tr>
                <th>Producto</th>
                <th>Marca</th>
                <th>Unidad</th>
                <th>Precio</th>
                <th>Fecha</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="reporte : ${reportes}">
                <td th:text="${reporte.producto.nombre}"></td>
                <td th:text="${reporte.producto.marca}"></td>
                <td th:text="${reporte.producto.unidad}"></td>
                <td th:text="'$' + ${reporte.precio}"></td>
                <td th:text="${#temporals.format(reporte.fechaDeReporte, 'dd/MM/yyyy')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
