<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoción por producto — Precios de Barrio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/comercio-panel.css}">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<header class="cm-cabecera">
    <div class="container">
        <div class="cm-cabecera-texto">
            <p class="cm-sobretitulo"><i class="bi bi-box-seam" aria-hidden="true"></i> Promoción por producto</p>
            <h1 id="titulo-pagina">Nueva promoción por producto</h1>
            <p class="cm-subtitulo">Un precio especial para un producto de tu comercio.</p>
        </div>
    </div>
</header>

<main class="container cm-principal">
    <div class="pr-form">
        <nav class="pr-migas" aria-label="Ubicación">
            <a th:href="@{/promociones/mis-promociones}"><i class="bi bi-arrow-left" aria-hidden="true"></i>&nbsp;Mis promociones</a>
            <span aria-hidden="true">/</span>
            <span>Por producto</span>
        </nav>

        <div th:if="${error}" class="cm-alerta cm-alerta-error" role="alert" id="error-promocion">
            <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
            <div class="cm-alerta-texto" th:text="${error}">Error</div>
        </div>

        <section class="cm-tarjeta" aria-labelledby="titulo-crear">
            <h2 class="cm-tarjeta-titulo" id="titulo-crear">
                <span class="cm-icono" aria-hidden="true"><i class="bi bi-megaphone"></i></span>
                Datos de la promoción
            </h2>

            <form th:action="@{/promociones/crear/producto}" th:object="${promocion}" method="post">
                <div class="cm-campo">
                    <label for="titulo" class="cm-etiqueta">Título</label>
                    <input id="titulo" type="text" th:field="*{titulo}" class="cm-control" maxlength="100"
                           placeholder="Ej: 2x1 en yerba" required>
                </div>
                <div class="cm-campo">
                    <label for="productoNombre" class="cm-etiqueta">Producto</label>
                    <input id="productoNombre" type="text" th:field="*{productoNombre}" class="cm-control"
                           maxlength="150" list="productos-del-comercio" autocomplete="off"
                           placeholder="Ej: Yerba mate 1kg" required>
                    <datalist id="productos-del-comercio">
                        <option th:each="nombre : ${productosDelComercio}" th:value="${nombre}"></option>
                    </datalist>
                    <p class="cm-ayuda">Podés elegir uno de los productos que ya cargaste o escribir otro.</p>
                </div>
                <div class="cm-campo">
                    <label for="precioPromocional" class="cm-etiqueta">Precio promocional</label>
                    <div class="cm-con-prefijo">
                        <span aria-hidden="true">$</span>
                        <input id="precioPromocional" type="number" th:field="*{precioPromocional}"
                               class="cm-control" min="0.01" max="10000000" step="0.01" inputmode="decimal" required>
                    </div>
                </div>
                <div class="cm-campo">
                    <label for="descripcion" class="cm-etiqueta">Descripción <span class="cm-opcional">(opcional)</span></label>
                    <textarea id="descripcion" th:field="*{descripcion}" class="cm-control" rows="3" maxlength="500"
                              placeholder="Qué incluye, condiciones, stock..."></textarea>
                </div>
                <div class="pr-fechas">
                    <div class="cm-campo">
                        <label for="fechaInicio" class="cm-etiqueta">Fecha de inicio</label>
                        <input id="fechaInicio" type="datetime-local" th:field="*{fechaInicio}"
                               class="cm-control js-selector" required>
                    </div>
                    <div class="cm-campo">
                        <label for="fechaFin" class="cm-etiqueta">Fecha de finalización</label>
                        <input id="fechaFin" type="datetime-local" th:field="*{fechaFin}"
                               class="cm-control js-selector" data-desde="fechaInicio" required>
                    </div>
                </div>
                <button type="submit" id="btn-crear-promocion" class="cm-btn cm-btn-principal cm-btn-bloque">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i> Crear promoción
                </button>
            </form>
        </section>
    </div>
</main>

<script th:src="@{/js/selector-fecha-hora.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{don-peso :: don-peso}"></div>
</body>
</html>
