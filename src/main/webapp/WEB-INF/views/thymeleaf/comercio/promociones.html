<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promociones de comercios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="mb-4">
        <h1 class="mb-1">Promociones de comercios</h1>
        <p class="text-muted mb-0">Ofertas vigentes de los comercios del barrio.</p>
    </div>

    <div th:if="${#lists.isEmpty(promociones)}" class="alert alert-info" id="sin-promociones">
        No hay promociones vigentes en este momento.
    </div>

    <div class="row g-3">
        <article th:each="item : ${promociones}" class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex flex-column">
                    <h2 class="h5" th:text="${item.titulo}"></h2>
                    <p class="text-muted" th:if="${item.descripcion != null}" th:text="${item.descripcion}"></p>
                    <p class="fs-4 fw-bold text-success mb-2"
                       th:text="${'$' + #numbers.formatDecimal(item.precioPromocional, 1, 'POINT', 2, 'COMMA')}"></p>
                    <p class="mb-1 mt-auto">
                        <i class="bi bi-shop" aria-hidden="true"></i>
                        <span th:text="${item.comercio.nombre}"></span>
                    </p>
                    <p class="text-muted small mb-0">
                        Válida hasta el
                        <span th:text="${#temporals.format(item.fechaFin, 'dd/MM/yyyy HH:mm')}"></span>
                    </p>
                </div>
            </div>
        </article>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{don-peso :: don-peso}"></div>
</body>
</html>
