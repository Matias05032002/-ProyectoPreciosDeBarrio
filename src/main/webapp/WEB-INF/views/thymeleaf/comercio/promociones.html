
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promociones de comercios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<main>
    <h1>Promociones de comercios</h1>

    <p th:if="${#lists.isEmpty(promociones)}">
        No hay promociones vigentes en este momento.
    </p>

    <article th:each="item : ${promociones}">
        <h2 th:text="${item.titulo}"></h2>
        <p th:text="${item.descripcion}"></p>

        <p>
            Precio promocional:
            <strong th:text="${item.precioPromocional}"></strong>
        </p>

        <p>
            Comercio:
            <span th:text="${item.comercio.nombre}"></span>
        </p>

        <p>
            Válida hasta:
            <span th:text="${#temporals.format(item.fechaFin, 'dd/MM/yyyy HH:mm')}"></span>
        </p>
    </article>
</main>
</body>
</html>
