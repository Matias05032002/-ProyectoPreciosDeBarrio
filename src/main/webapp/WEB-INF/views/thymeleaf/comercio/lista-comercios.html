<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comercios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <form th:action="@{/comercio/buscar}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="nombre" id="comercio-buscar" class="form-control form-control-lg"
                   placeholder="Buscá un comercio...">
            <button type="submit" id="btn-buscar-comercio" class="btn btn-primary">Buscar</button>
        </div>
    </form>
    <h2>Comercios del barrio</h2>
    <p class="text-muted">Almacenes, verdulerías, carnicerías y más.</p>

    <div th:if="${#lists.isEmpty(comercios)}" class="alert alert-info mt-3">
        No se encontraron comercios.
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4 mt-2">
        <div class="col" th:each="comercio : ${comercios}">
            <div class="card h-100 shadow-sm" th:id="'card-comercio-' + ${comercio.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${comercio.nombre}"></h5>
                    <span class="badge bg-secondary mb-2" th:text="${comercio.tipo}"></span>
                    <p class="card-text mb-1">
                        <span class="text-muted">Dirección:</span>
                        <span th:text="${comercio.direccion}"></span>
                    </p>
                    <p class="card-text text-muted">
                        <small th:text="${comercio.localidad}"></small>
                    </p>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/comercio/{id}(id=${comercio.id})}"
                       th:id="'btn-ver-detalle-' + ${comercio.id}"
                       class="btn btn-outline-primary btn-sm w-100">
                        Ver detalle
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
