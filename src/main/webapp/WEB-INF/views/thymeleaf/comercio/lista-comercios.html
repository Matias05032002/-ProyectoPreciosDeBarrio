<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comercios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <form th:action="@{/comercio/buscar}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="nombre" class="form-control form-control-lg"
                   placeholder="Buscá un comercio...">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
    </form>
    <h2>Comercios del barrio</h2>
    <p class="text-muted">Almacenes, verdulerías, carnicerías y más.</p>
    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Localidad</th>
            <th>Tipo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="comercio : ${comercios}">
            <td th:text="${comercio.nombre}"></td>
            <td th:text="${comercio.direccion}"></td>
            <td th:text="${comercio.localidad}"></td>
            <td th:text="${comercio.tipo}"></td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
