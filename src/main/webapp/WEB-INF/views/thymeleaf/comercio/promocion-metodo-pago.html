<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoción por método de pago — Precios de Barrio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/comercio-panel.css}">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<header class="cm-cabecera">
    <div class="container">
        <div class="cm-cabecera-texto">
            <p class="cm-sobretitulo"><i class="bi bi-credit-card-2-front" aria-hidden="true"></i> Promoción por método de pago</p>
            <h1 id="titulo-pagina">Nueva promoción por método de pago</h1>
            <p class="cm-subtitulo">Un descuento cuando el vecino paga de una forma en particular.</p>
        </div>
    </div>
</header>

<main class="container cm-principal">
    <div class="pr-form">
        <nav class="pr-migas" aria-label="Ubicación">
            <a th:href="@{/promociones/mis-promociones}"><i class="bi bi-arrow-left" aria-hidden="true"></i>&nbsp;Mis promociones</a>
            <span aria-hidden="true">/</span>
            <span>Por método de pago</span>
        </nav>

        <div th:if="${error}" class="cm-alerta cm-alerta-error" role="alert" id="error-promocion">
            <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
            <div class="cm-alerta-texto" th:text="${error}">Error</div>
        </div>

        <section class="cm-tarjeta" aria-labelledby="titulo-crear">
            <h2 class="cm-tarjeta-titulo" id="titulo-crear">
                <span class="cm-icono" aria-hidden="true"><i class="bi bi-megaphone"></i></span>
                Datos de la promoción
            </h2>

            <form th:action="@{/promociones/crear/metodo-pago}" th:object="${promocion}" method="post">
                <div class="cm-campo">
                    <label for="titulo" class="cm-etiqueta">Título</label>
                    <input id="titulo" type="text" th:field="*{titulo}" class="cm-control" maxlength="100"
                           placeholder="Ej: 20% pagando con débito" required>
                </div>

                <div class="cm-campo">
                    <fieldset class="pr-grupo">
                        <legend class="cm-etiqueta">Método de pago</legend>
                        <div class="pr-metodos">
                            <label th:each="metodo : ${metodosPago}" class="pr-metodo">
                                <input type="radio" name="metodoPago" th:id="'metodo-' + ${metodo.name()}"
                                       th:value="${metodo.name()}" th:checked="${promocion.metodoPago == metodo}" required>
                                <span class="pr-metodo-tarjeta" th:attr="data-etiqueta=${metodo.etiqueta}">
                                <i class="bi" th:classappend="${metodo.icono}" aria-hidden="true"></i>
                                <span th:text="${metodo.etiqueta}">Efectivo</span>
                            </span>
                            </label>
                        </div>
                    </fieldset>
                </div>

                <div class="cm-campo">
                    <label for="porcentajeDescuento" class="cm-etiqueta">Descuento</label>
                    <div class="cm-con-prefijo cm-con-sufijo">
                        <input id="porcentajeDescuento" type="number" th:field="*{porcentajeDescuento}"
                               class="cm-control" min="1" max="90" step="1" inputmode="numeric"
                               placeholder="20" required>
                        <span aria-hidden="true">%</span>
                    </div>
                    <div class="pr-porcentajes" role="group" aria-label="Descuentos frecuentes">
                        <button type="button" class="pr-porcentaje" data-valor="5" aria-pressed="false">5%</button>
                        <button type="button" class="pr-porcentaje" data-valor="10" aria-pressed="false">10%</button>
                        <button type="button" class="pr-porcentaje" data-valor="15" aria-pressed="false">15%</button>
                        <button type="button" class="pr-porcentaje" data-valor="20" aria-pressed="false">20%</button>
                        <button type="button" class="pr-porcentaje" data-valor="25" aria-pressed="false">25%</button>
                        <button type="button" class="pr-porcentaje" data-valor="30" aria-pressed="false">30%</button>
                    </div>
                </div>

                <p class="pr-vista-previa" id="vista-previa" hidden aria-live="polite">
                    <i class="bi bi-tag-fill" aria-hidden="true"></i>
                    <span id="vista-previa-texto"></span>
                </p>

                <div class="cm-campo">
                    <label for="descripcion" class="cm-etiqueta">Descripción <span class="cm-opcional">(opcional)</span></label>
                    <textarea id="descripcion" th:field="*{descripcion}" class="cm-control" rows="3" maxlength="500"
                              placeholder="Días, topes de reintegro, condiciones..."></textarea>
                </div>
                <div class="pr-fechas">
                    <div class="cm-campo">
                        <label for="fechaInicio" class="cm-etiqueta">Fecha de inicio</label>
                        <input id="fechaInicio" type="datetime-local" th:field="*{fechaInicio}"
                               class="cm-control js-selector" required>
                    </div>
                    <div class="cm-campo">
                        <label for="fechaFin" class="cm-etiqueta">Fecha de finalización</label>
                        <input id="fechaFin" type="datetime-local" th:field="*{fechaFin}"
                               class="cm-control js-selector" data-desde="fechaInicio" required>
                    </div>
                </div>
                <button type="submit" id="btn-crear-promocion" class="cm-btn cm-btn-principal cm-btn-bloque">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i> Crear promoción
                </button>
            </form>
        </section>
    </div>
</main>

<script th:src="@{/js/selector-fecha-hora.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        var campo = document.getElementById('porcentajeDescuento');
        var atajos = document.querySelectorAll('.pr-porcentaje');
        var vista = document.getElementById('vista-previa');
        var texto = document.getElementById('vista-previa-texto');

        function metodoElegido() {
            var radio = document.querySelector('input[name="metodoPago"]:checked');
            return radio ? radio.parentNode.querySelector('.pr-metodo-tarjeta').getAttribute('data-etiqueta') : '';
        }

        function actualizar() {
            var valor = parseInt(campo.value, 10);
            var metodo = metodoElegido();
            atajos.forEach(function (b) {
                b.setAttribute('aria-pressed', String(parseInt(b.getAttribute('data-valor'), 10) === valor));
            });
            if (valor >= 1 && valor <= 90 && metodo) {
                texto.textContent = valor + '% de descuento pagando con ' + metodo.toLowerCase();
                vista.hidden = false;
            } else {
                vista.hidden = true;
            }
        }

        atajos.forEach(function (b) {
            b.addEventListener('click', function () {
                campo.value = b.getAttribute('data-valor');
                actualizar();
            });
        });
        campo.addEventListener('input', actualizar);
        document.querySelectorAll('input[name="metodoPago"]').forEach(function (r) {
            r.addEventListener('change', actualizar);
        });
        actualizar();
    }());
</script>
<div th:replace="~{don-peso :: don-peso}"></div>
</body>
</html>
