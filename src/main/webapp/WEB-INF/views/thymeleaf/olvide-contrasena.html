<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña — Precios de Barrio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<main class="recovery-card">
    <a th:href="@{/home}" class="recovery-brand"><span class="recovery-brand-icon">⌖</span><span>Precios <strong>de Barrio</strong></span></a>
    <h1>¿Olvidaste tu contraseña?</h1>
    <p>Escribí el email de tu cuenta y te mandamos un link para elegir una nueva.</p>

    <p th:if="${pedidoEnviado != null}" id="pedido-enviado" class="alert alert-success" role="status"
       th:text="${pedidoEnviado}"></p>

    <form th:action="@{/olvide-contrasena}" method="post">
        <div class="recovery-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="vos@barrio.com"
                   autocomplete="email" maxlength="150" required>
        </div>

        <button type="submit" id="btn-enviar-link" class="recovery-action">Enviarme el link</button>
    </form>

    <a th:href="@{/login}" class="recovery-back">¿Te acordaste? Volver a ingresar</a>
</main>

</body>
</html>
