<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">

    <form th:action="@{/producto/buscar}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="nombre" id="buscador-producto" class="form-control form-control-lg"
                   placeholder="¿Qué producto buscás?">
            <button type="submit" id="btn-buscar-producto" class="btn btn-primary">Buscar</button>
        </div>
    </form>

    <h2>Productos del barrio</h2>
    <p class="text-muted">Encontrá dónde está más barato antes de salir a comprar.</p>

    <div class="row row-cols-1 row-cols-md-3 g-4 mt-2">
        <div class="col" th:each="producto : ${productos}">
            <div class="card h-100 shadow-sm" id="card-producto">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        <h5 class="card-title mb-0" th:text="${producto.nombre}"></h5>
                        <span th:text="${producto.antiguedad}"
                              th:classappend="${producto.antiguedad == 'Fresco'} ? 'bg-success' : (${producto.antiguedad == 'Desactualizado'} ? 'bg-warning text-dark' : 'bg-danger')"
                              class="badge" id="badge-antiguedad">
                        </span>
                        <span th:if="${producto.esDudoso}" class="badge bg-secondary ms-1">Dudoso</span>
                    </div>
                    <p class="card-text text-muted mb-1">
                        <span th:text="${producto.marca}"></span> ·
                        <span th:text="${producto.unidad}"></span>
                    </p>
                    <p class="card-text">
                        <span class="text-muted small" th:text="${producto.categoria}"></span>
                    </p>
                    <p class="card-text fw-bold text-success" th:if="${producto.precioMinimo != null}">
                        Desde $<span th:text="${producto.precioMinimo}"></span>
                    </p>
                    <p class="card-text text-muted small" th:if="${producto.comercio != null}">
                        en <span th:text="${producto.comercio}"></span>
                    <form th:if="${producto.reporteId != null}"
                          th:action="@{/reporte/{id}/dudoso(id=${producto.reporteId})}"
                          method="post" class="mt-2">
                        <input type="hidden" name="nombreProducto" th:value="${producto.nombre}">
                        <button type="submit" id="btn-marcar-dudoso" class="btn btn-outline-danger btn-sm">Marcar dudoso</button>
                    </form>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${productos == null or #lists.isEmpty(productos)}" class="text-center mt-5">
        <p class="text-muted">Buscá un producto para ver los resultados.</p>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
