<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<div class="container mt-4">

    <form th:action="@{/producto/buscar}" method="get" class="mb-4" id="form-buscar">
        <div class="input-group">
            <input type="text" name="nombre" id="buscador-producto" class="form-control form-control-lg"
                   placeholder="¿Qué producto buscás?" th:value="${busqueda}">

            <select name="orden" id="orden-productos" class="form-select form-select-lg">
                <option value="precio" th:selected="${orden == 'precio'}">Menor precio</option>
                <option value="reciente" th:selected="${orden == 'reciente'}">Más reciente</option>
                <option value="cercania" th:selected="${orden == 'cercania'}">Más cercano</option>
            </select>

            <input type="hidden" name="lat" id="lat-usuario" th:value="${lat}">
            <input type="hidden" name="lng" id="lng-usuario" th:value="${lng}">

            <button type="submit" id="btn-buscar-producto" class="btn btn-primary">
                Buscar
            </button>
        </div>
    </form>

    <h2>Productos del barrio</h2>
    <p class="text-muted">Encontrá dónde está más barato antes de salir a comprar.</p>

    <div class="row row-cols-1 row-cols-md-3 g-4 mt-2">
        <div class="col" th:each="producto : ${productos}">
            <div class="card h-100 shadow-sm"
                 th:id="'card-producto-' + ${producto.reporteId}">

                <!-- Foto asociada al reporte del producto -->
                <img th:if="${producto.reporteId != null}"
                     th:src="@{/reporte/{id}/foto(id=${producto.reporteId})}"
                     class="card-img-top"
                     alt="Foto del producto"
                     style="height: 200px; object-fit: contain;">

                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        <h5 class="card-title mb-0" th:text="${producto.nombre}"></h5>

                        <span th:text="${producto.antiguedad}"
                              th:classappend="${producto.antiguedad == 'Fresco'} ? 'bg-success' : (${producto.antiguedad == 'Desactualizado'} ? 'bg-warning text-dark' : 'bg-danger')"
                              class="badge"
                              th:id="'badge-antiguedad-' + ${producto.reporteId}">
                        </span>

                        <span th:if="${producto.esDudoso}" class="badge bg-secondary ms-1">
                            Dudoso
                        </span>
                    </div>

                    <p class="card-text text-muted mb-1">
                        <span th:text="${producto.marca}"></span> ·
                        <span th:text="${producto.unidad}"></span>
                    </p>

                    <p class="card-text">
                        <span class="text-muted small" th:text="${producto.categoria}"></span>
                    </p>

                    <p class="card-text fw-bold text-success"
                       th:if="${producto.precioMinimo != null}">
                        Desde
                        <span th:text="${'$' + #numbers.formatDecimal(producto.precioMinimo, 1, 'COMMA', 2, 'POINT')}"></span>
                    </p>

                    <p class="card-text text-muted small" th:if="${producto.comercio != null}">
                        en <span th:text="${producto.comercio}"></span>
                        <span th:if="${producto.distanciaKm != null}">
                            · <span th:text="${#numbers.formatDecimal(producto.distanciaKm, 1, 2) + ' km'}"></span>
                        </span>
                    </p>

                    <form th:if="${producto.reporteId != null}"
                          th:action="@{/reporte/{id}/dudoso(id=${producto.reporteId})}"
                          method="post"
                          class="mt-2">
                        <input type="hidden" name="nombreProducto" th:value="${producto.nombre}">

                        <button type="submit"
                                th:id="'btn-marcar-dudoso-' + ${producto.reporteId}"
                                class="btn btn-outline-danger btn-sm"
                                th:disabled="${producto.yaMarcoDudoso}"
                                th:text="${producto.yaMarcoDudoso} ? 'Ya marcaste dudoso' : 'Marcar dudoso'">
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${productos == null or #lists.isEmpty(productos)}"
         class="text-center mt-5">
        <p class="text-muted">Buscá un producto para ver los resultados.</p>
    </div>

</div>

<div th:if="${dudosoMarcado}" id="modalDudoso" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">¡Gracias por tu reporte!</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                Marcaste este reporte como dudoso. ¡Estás ayudando a mantener la información confiable!
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
                    Cerrar
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:if="${dudosoMarcado}">
    var modal = new bootstrap.Modal(document.getElementById('modalDudoso'));
    modal.show();
</script>

<script>
    document.getElementById('form-buscar').addEventListener('submit', function(e) {
        var orden = document.getElementById('orden-productos').value;

        if (orden === 'cercania') {
            var latInput = document.getElementById('lat-usuario');
            var lngInput = document.getElementById('lng-usuario');

            if (!latInput.value || !lngInput.value) {
                e.preventDefault();

                navigator.geolocation.getCurrentPosition(function(pos) {
                    latInput.value = pos.coords.latitude;
                    lngInput.value = pos.coords.longitude;
                    document.getElementById('form-buscar').submit();
                }, function() {
                    alert('No se pudo obtener tu ubicación. Activá el GPS o los permisos del navegador.');
                });
            }
        } else {
            document.getElementById('lat-usuario').value = '';
            document.getElementById('lng-usuario').value = '';
        }
    });
</script>

</body>
</html>
