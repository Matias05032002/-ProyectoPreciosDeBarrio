<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dar feedback - Mapa de Precios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>

<nav th:replace="~{navbar :: navbar}"></nav>

<main class="container mt-5 mb-5">
    <h1>Dar feedback</h1>
    <p class="text-muted">
        ¿Tenés alguna sugerencia, consulta o problema? Contanos.
    </p>
    <hr>

    <div th:if="${mensajeExito != null}" class="alert alert-success"
         th:text="${mensajeExito}">
    </div>

    <form th:action="@{/feedback}" method="POST">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" id="nombre" name="nombre"
                   class="form-control" required maxlength="100">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" id="email" name="email"
                   class="form-control" required maxlength="150">
        </div>

        <div class="mb-3">
            <label for="asunto" class="form-label">Asunto</label>
            <select id="asunto" name="asunto" class="form-select" required>
                <option value="">Seleccioná una opción</option>
                <option value="Sugerencia">Sugerencia</option>
                <option value="Consulta">Consulta</option>
                <option value="Problema">Reportar un problema</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea id="mensaje" name="mensaje" class="form-control"
                      rows="5" required maxlength="2000"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enviar mensaje</button>
        <a th:href="@{/home}" class="btn btn-outline-secondary ms-2">Volver</a>
    </form>
</main>
<div th:replace="~{don-peso :: don-peso}"></div>
</body>
</html>
