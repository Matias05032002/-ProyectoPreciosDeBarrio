<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="don-peso" id="don-peso-widget" class="dpw" th:attr="data-base=@{/asistente}">

    <link rel="stylesheet" th:href="@{/css/don-peso.css}" />

    <button type="button" class="dpw-fab" id="dpw-abrir" aria-label="Abrir chat con Don Peso"
            aria-expanded="false" aria-controls="dpw-panel">
        <img th:src="@{/css/don-peso-moneda.png}" alt="" width="44" height="44" />
        <span class="dpw-fab-etiqueta">Preguntale a Don Peso</span>
    </button>

    <section class="dpw-panel" id="dpw-panel" role="dialog" aria-labelledby="dpw-titulo" hidden>
        <header class="dpw-cabecera">
            <img class="dpw-avatar" th:src="@{/css/don-peso-moneda.png}" alt="" width="40" height="40" />
            <div class="dpw-cabecera-texto">
                <h2 class="dpw-titulo" id="dpw-titulo">Don Peso</h2>
                <p class="dpw-subtitulo">Tu asistente de precios del barrio</p>
            </div>
            <button type="button" class="dpw-icono" id="dpw-nueva" aria-label="Empezar una conversación nueva" title="Conversación nueva">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
            </button>
            <button type="button" class="dpw-icono" id="dpw-cerrar" aria-label="Cerrar el chat" title="Cerrar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </header>

        <div class="dpw-mensajes" id="dpw-mensajes" role="log" aria-live="polite" aria-relevant="additions"></div>

        <div class="dpw-sugerencias" id="dpw-sugerencias" aria-label="Preguntas sugeridas"></div>

        <form class="dpw-form" id="dpw-form" autocomplete="off">
            <label class="dpw-sr" for="dpw-entrada">Escribile a Don Peso</label>
            <input class="dpw-entrada" id="dpw-entrada" type="text" maxlength="300"
                   placeholder="Escribí tu consulta…" enterkeyhint="send" />
            <button class="dpw-enviar" type="submit" aria-label="Enviar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
            </button>
        </form>
    </section>

    <script type="module" th:src="@{/js/don-peso.js}"></script>
</div>
</body>
</html>
