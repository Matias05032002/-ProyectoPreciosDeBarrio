<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Listas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Mis listas de compras</h2>
        <button id="btn-abrir-modal-crear" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrearLista">
            + Crear lista
        </button>
    </div>

    <div th:if="${#lists.isEmpty(listas)}" class="text-center mt-5">
        <p class="text-muted">Todavía no tenés listas creadas.</p>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrearLista">
            Crear mi primera lista
        </button>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${!#lists.isEmpty(listas)}">
        <div class="col" th:each="lista : ${listas}">
            <div class="card h-100 shadow-sm card-lista">
                <div class="card-body">
                    <h5 class="card-title" th:text="${lista.nombre}"></h5>
                    <p class="card-text text-muted">
                        <span th:text="${lista.cantidadProductos}"></span> productos
                    </p>
                    <p class="card-text text-muted small"
                       th:text="${lista.fechaCreacion.toLocalDate()}">
                    </p>
                </div>
                <div class="card-footer bg-transparent d-flex gap-2">
                    <a th:href="@{/mis-listas/{id}(id=${lista.id})}"
                       class="btn btn-outline-primary w-100"
                       th:id="'btn-ver-lista-' + ${lista.id}">
                        Ver lista
                    </a>
                    <form th:action="@{/mis-listas/eliminar}" method="post">
                        <input type="hidden" name="listaId" th:value="${lista.id}">
                        <button type="submit"
                                class="btn btn-outline-danger"
                                th:id="'btn-eliminar-lista-' + ${lista.id}">
                            Eliminar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal crear lista -->
<div class="modal fade" id="modalCrearLista" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nueva lista</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/mis-listas/crear}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="nombreLista" class="form-label">Nombre de la lista</label>
                        <input type="text" class="form-control" id="nombreLista"
                               name="nombre" placeholder="Ej: Super del jueves" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" id="btn-crear-lista" class="btn btn-primary">Crear</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
