<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${lista.nombre}">Detalle Lista</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/listas.css}" />
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<header class="ls-cabecera">
    <div class="container">
        <a th:href="@{/mis-listas}" class="ls-volver" id="btn-volver-listas">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Mis listas
        </a>
        <h1 id="titulo-lista" th:text="${lista.nombre}">Super del jueves</h1>
        <ul class="ls-chips" th:if="${!#lists.isEmpty(lista.items)}">
            <li class="ls-chip">
                <i class="bi bi-basket3" aria-hidden="true"></i>
                <span><span th:text="${#lists.size(lista.items)}">0</span> productos</span>
            </li>
        </ul>
    </div>
</header>

<main class="container ls-principal">

    <!-- Lista vacía -->
    <div th:if="${#lists.isEmpty(lista.items)}" class="ls-vacio">
        <div class="ls-vacio-icono"><i class="bi bi-cart-x" aria-hidden="true"></i></div>
        <h2>Tu lista está vacía</h2>
        <p>Buscá productos y agregalos desde la lista de productos.</p>
        <a th:href="@{/producto}" class="ls-btn ls-btn-principal" id="btn-buscar-productos">
            <i class="bi bi-search" aria-hidden="true"></i> Buscar productos
        </a>
    </div>

    <!-- Items de la lista -->
    <div th:if="${!#lists.isEmpty(lista.items)}">
        <ul class="ls-items">
            <li class="ls-item" th:each="item : ${lista.items}">
                <div class="ls-item-datos">
                    <div>
                        <h3 th:id="'nombre-item-' + ${item.id}" th:text="${item.nombreProducto}">Producto</h3>
                        <p class="ls-item-comercio">
                            <i class="bi bi-shop" aria-hidden="true"></i>
                            <span th:text="${item.nombreComercio}">Comercio</span>
                        </p>
                    </div>
                    <p class="ls-precio"
                       th:text="${'$' + #numbers.formatDecimal(item.precio, 1, 'POINT', 2, 'COMMA')}">$ 0,00</p>
                </div>

                <div class="ls-item-acciones">
                    <form th:action="@{/mis-listas/editar-item}" method="post" class="ls-form-cantidad">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <input type="hidden" name="listaId" th:value="${lista.id}">
                        <div class="ls-cantidad">
                            <button type="button" class="ls-menos" aria-label="Una unidad menos">
                                <i class="bi bi-dash-lg" aria-hidden="true"></i>
                            </button>
                            <input type="number" name="cantidad" th:value="${item.cantidad}"
                                   min="1" max="99" inputmode="numeric" aria-label="Cantidad"
                                   th:id="'input-cantidad-' + ${item.id}">
                            <button type="button" class="ls-mas" aria-label="Una unidad más">
                                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                            </button>
                        </div>
                        <button type="submit" class="ls-btn ls-btn-chico ls-btn-actualizar"
                                th:id="'btn-editar-item-' + ${item.id}"
                                aria-label="Guardar la cantidad" title="Guardar la cantidad">
                            <i class="bi bi-check-lg" aria-hidden="true"></i> Guardar
                        </button>
                    </form>
                    <form th:action="@{/mis-listas/eliminar-item}" method="post">
                        <input type="hidden" name="itemId" th:value="${item.id}">
                        <input type="hidden" name="listaId" th:value="${lista.id}">
                        <button type="submit" class="ls-btn ls-btn-chico ls-btn-peligro"
                                th:id="'btn-eliminar-item-' + ${item.id}"
                                aria-label="Quitar de la lista" title="Quitar de la lista">
                            <i class="bi bi-trash3" aria-hidden="true"></i>
                        </button>
                    </form>
                </div>
            </li>
        </ul>

        <!-- Total -->
        <div class="ls-total">
            <div>
                <p class="ls-total-texto">Total estimado</p>
                <p id="total-lista" class="ls-total-monto"
                   th:text="${'$' + #numbers.formatDecimal(lista.total, 1, 'POINT', 2, 'COMMA')}">$ 0,00</p>
            </div>
            <a th:href="@{/producto}" class="ls-btn ls-btn-claro">
                <i class="bi bi-plus-lg" aria-hidden="true"></i> Agregar más productos
            </a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Botones − / +: cambian la cantidad y marcan "Guardar" como pendiente
    Array.prototype.forEach.call(document.querySelectorAll('.ls-form-cantidad'), function (form) {
        var campo = form.querySelector('input[name="cantidad"]');
        var guardar = form.querySelector('.ls-btn-actualizar');
        var inicial = campo.value;

        function cambiar(delta) {
            var nueva = (parseInt(campo.value, 10) || 1) + delta;
            campo.value = Math.min(99, Math.max(1, nueva));
            marcar();
        }
        function marcar() {
            guardar.classList.toggle('hay-cambio', campo.value !== inicial);
        }
        form.querySelector('.ls-menos').addEventListener('click', function () { cambiar(-1); });
        form.querySelector('.ls-mas').addEventListener('click', function () { cambiar(1); });
        campo.addEventListener('input', marcar);
    });
</script>
<div th:replace="~{don-peso :: don-peso}"></div>
</body>
</html>
