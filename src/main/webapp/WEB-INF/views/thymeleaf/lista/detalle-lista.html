<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${lista.nombre}">Detalle Lista</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex align-items-center mb-4 gap-3">
        <a th:href="@{/mis-listas}" class="btn btn-outline-secondary btn-sm">← Volver</a>
        <h2 th:text="${lista.nombre}" class="mb-0"></h2>
    </div>

    <!-- Lista vacía -->
    <div th:if="${#lists.isEmpty(lista.items)}" class="text-center mt-5">
        <p class="text-muted fs-5">Tu lista está vacía</p>
        <p class="text-muted">Buscá productos y agregalos desde la lista de productos.</p>
        <a th:href="@{/producto}" class="btn btn-primary" id="btn-buscar-productos">
            Buscar productos
        </a>
    </div>

    <!-- Items de la lista -->
    <div th:if="${!#lists.isEmpty(lista.items)}">
        <div class="row row-cols-1 row-cols-md-2 g-3">
            <div class="col" th:each="item : ${lista.items}">
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1" th:text="${item.nombreProducto}"></h6>
                            <p class="text-muted small mb-1" th:text="${item.nombreComercio}"></p>
                            <p class="fw-bold text-success mb-0"
                               th:text="${'$' + #numbers.formatDecimal(item.precio, 1, 'COMMA', 2, 'POINT')}">
                            </p>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <form th:action="@{/mis-listas/editar-item}" method="post" class="d-flex align-items-center gap-1">
                                <input type="hidden" name="itemId" th:value="${item.id}">
                                <input type="hidden" name="listaId" th:value="${lista.id}">
                                <input type="number" name="cantidad" th:value="${item.cantidad}"
                                       min="1" max="99" class="form-control form-control-sm"
                                       style="width: 65px;"
                                       th:id="'input-cantidad-' + ${item.id}">
                                <button type="submit" class="btn btn-outline-secondary btn-sm"
                                        th:id="'btn-editar-item-' + ${item.id}">
                                    ✓
                                </button>
                            </form>
                            <form th:action="@{/mis-listas/eliminar-item}" method="post">
                                <input type="hidden" name="itemId" th:value="${item.id}">
                                <input type="hidden" name="listaId" th:value="${lista.id}">
                                <button type="submit" class="btn btn-outline-danger btn-sm"
                                        th:id="'btn-eliminar-item-' + ${item.id}">
                                    X
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Total -->
        <div class="card mt-4 border-success">
            <div class="card-body d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Total estimado</h5>
                <h4 class="mb-0 text-success fw-bold"
                    th:text="${'$' + #numbers.formatDecimal(lista.total, 1, 'COMMA', 2, 'POINT')}">
                </h4>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/producto}" class="btn btn-outline-primary">
                + Agregar más productos
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{don-peso :: don-peso}"></div>
</body>
</html>
