<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis Reportes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <h2>Mis reportes</h2>
    <p class="text-muted">Los precios que publicaste en tu comercio.</p>
    <hr>

    <div th:if="${param.editado}" class="alert alert-success">
        Reporte editado con éxito.
    </div>

    <div th:if="${#lists.isEmpty(reportes)}" class="alert alert-info mt-3">
        Todavía no publicaste ningún reporte.
    </div>

    <div th:if="${not #lists.isEmpty(reportes)}" class="row row-cols-1 row-cols-md-3 g-4 mt-2">
        <div class="col" th:each="reporte : ${reportes}">
            <div class="card h-100 shadow-sm" th:id="'card-mi-reporte-' + ${reporte.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${reporte.producto.nombre}"></h5>
                    <p class="card-text text-muted mb-1">
                        <span th:text="${reporte.producto.marca}"></span> ·
                        <span th:text="${reporte.producto.unidad}"></span>
                    </p>
                    <p class="card-text fw-bold text-success">
                        $<span th:text="${reporte.precio}"></span>
                    </p>
                    <p class="card-text text-muted small"
                       th:text="${#temporals.format(reporte.fechaDeReporte, 'dd/MM/yyyy')}">
                    </p>
                    <div class="mt-2"
                         th:if="${reporte.fechaDeReporte != null and reporte.fechaDeReporte.isAfter(#temporals.createNow().minusDays(2))}">
                        <a th:href="@{/reporte/{id}/editar(id=${reporte.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                    </div>
                    <p class="card-text text-muted small">
                        <i class="bi bi-shop"></i>
                        <span th:text="${reporte.comercio.nombre}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <!-- Paginación -->
    <div th:if="${totalPaginas != null and totalPaginas > 1}"
         class="d-flex justify-content-center align-items-center gap-3 mt-4 mb-2">
        <a th:if="${pagina > 0}"
           th:href="@{/reporte/mis-reportes(pagina=${pagina - 1})}"
           class="btn btn-outline-primary">
            &larr; Anterior
        </a>
        <span class="text-muted">
        Página <span th:text="${pagina + 1}"></span>
        de <span th:text="${totalPaginas}"></span>
    </span>
        <a th:if="${pagina + 1 < totalPaginas}"
           th:href="@{/reporte/mis-reportes(pagina=${pagina + 1})}"
           class="btn btn-outline-primary">
            Siguiente &rarr;
        </a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
