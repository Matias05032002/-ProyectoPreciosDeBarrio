<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmar productos del ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <h2>Productos detectados en el ticket</h2>
    <p class="text-muted">Revisá y corregí si hace falta. Después guardá todos de una.</p>

    <div th:if="${#lists.isEmpty(items)}" class="alert alert-warning">
        No se detectaron productos en el ticket. Probá con una foto más clara o cargá manualmente.
        <a th:href="@{/reporte}" class="btn btn-primary ms-3">Cargar manualmente</a>
    </div>

    <form th:if="${not #lists.isEmpty(items)}" th:action="@{/reporte/ticket/guardar}" method="post">
        <input type="hidden" name="comercioNombre" th:value="${comercioNombre}">
        <input type="hidden" name="comercioDireccion" th:value="${comercioDireccion}">
        <input type="hidden" name="comercioLocalidad" th:value="${comercioLocalidad}">

        <div class="alert alert-info">
            <strong>Comercio:</strong> <span th:text="${comercioNombre}"></span> —
            <span th:text="${comercioDireccion}"></span>, <span th:text="${comercioLocalidad}"></span>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Incluir</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, stat : ${items}">
                <td>
                    <input type="text" class="form-control"
                           th:name="'items[' + ${stat.index} + '].nombre'"
                           th:value="${item.nombre}">
                </td>
                <td>
                    <input type="number" step="0.01" class="form-control"
                           th:name="'items[' + ${stat.index} + '].precio'"
                           th:value="${item.precio}">
                </td>
                <td class="text-center">
                    <input type="checkbox"
                           th:name="'incluir[' + ${stat.index} + ']'"
                           checked>
                </td>
            </tr>
            </tbody>
        </table>

        <button type="submit" class="btn btn-success">Guardar todos</button>
        <a th:href="@{/reporte/ticket}" class="btn btn-secondary ms-2">Volver</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
