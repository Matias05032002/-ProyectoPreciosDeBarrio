<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar reporte</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <h2>Editar reporte</h2>
    <p class="text-muted">Podés modificar este reporte porque fue cargado hace menos de 2 días.</p>

    <form th:action="@{/reporte/{id}/editar(id=${reporte.id})}" method="post" class="mt-3">
        <input type="hidden" name="fotoBase64" id="foto-base64">

        <h6 class="text-muted mt-3">Datos del producto</h6>
        <div class="mb-3">
            <input type="text" name="producto.nombre" class="form-control"
                   placeholder="Nombre del producto"
                   th:value="${reporte.producto.nombre}">
        </div>
        <div class="mb-3">
            <input type="text" name="producto.marca" class="form-control"
                   placeholder="Marca"
                   th:value="${reporte.producto.marca}">
        </div>
        <div class="mb-3">
            <select name="producto.categoria" class="form-select">
                <option value="">Seleccionar categoria</option>
                <option value="Almacen"               th:selected="${reporte.producto.categoria == 'Almacen'}">Almacén</option>
                <option value="Bebidas con alcohol"   th:selected="${reporte.producto.categoria == 'Bebidas con alcohol'}">Bebidas con alcohol</option>
                <option value="Bebidas sin alcohol"   th:selected="${reporte.producto.categoria == 'Bebidas sin alcohol'}">Bebidas sin alcohol</option>
                <option value="Carnes y aves"         th:selected="${reporte.producto.categoria == 'Carnes y aves'}">Carnes y aves</option>
                <option value="Cereales y legumbres"  th:selected="${reporte.producto.categoria == 'Cereales y legumbres'}">Cereales y legumbres</option>
                <option value="Condimentos y salsas"  th:selected="${reporte.producto.categoria == 'Condimentos y salsas'}">Condimentos y salsas</option>
                <option value="Congelados"            th:selected="${reporte.producto.categoria == 'Congelados'}">Congelados</option>
                <option value="Enlatados y conservas" th:selected="${reporte.producto.categoria == 'Enlatados y conservas'}">Enlatados y conservas</option>
                <option value="Farmacia y perfumeria" th:selected="${reporte.producto.categoria == 'Farmacia y perfumeria'}">Farmacia y perfumería</option>
                <option value="Ferreteria y bazar"    th:selected="${reporte.producto.categoria == 'Ferreteria y bazar'}">Ferretería y bazar</option>
                <option value="Fiambres y embutidos"  th:selected="${reporte.producto.categoria == 'Fiambres y embutidos'}">Fiambres y embutidos</option>
                <option value="Higiene personal"      th:selected="${reporte.producto.categoria == 'Higiene personal'}">Higiene personal</option>
                <option value="Lacteos"               th:selected="${reporte.producto.categoria == 'Lacteos'}">Lácteos</option>
                <option value="Limpieza del hogar"    th:selected="${reporte.producto.categoria == 'Limpieza del hogar'}">Limpieza del hogar</option>
                <option value="Mascotas"              th:selected="${reporte.producto.categoria == 'Mascotas'}">Mascotas</option>
                <option value="Panaderia y reposteria" th:selected="${reporte.producto.categoria == 'Panaderia y reposteria'}">Panadería y repostería</option>
                <option value="Pescados y mariscos"   th:selected="${reporte.producto.categoria == 'Pescados y mariscos'}">Pescados y mariscos</option>
                <option value="Productos de dietetica" th:selected="${reporte.producto.categoria == 'Productos de dietetica'}">Productos de dietética</option>
                <option value="Snacks y golosinas"    th:selected="${reporte.producto.categoria == 'Snacks y golosinas'}">Snacks y golosinas</option>
                <option value="Tabaco"                th:selected="${reporte.producto.categoria == 'Tabaco'}">Tabaco</option>
                <option value="Verduras y frutas"     th:selected="${reporte.producto.categoria == 'Verduras y frutas'}">Verduras y frutas</option>
            </select>
        </div>
        <div class="mb-3">
            <input type="text" name="producto.unidad" class="form-control"
                   placeholder="Unidad (ej: 1kg, 900ml)"
                   th:value="${reporte.producto.unidad}">
        </div>

        <h6 class="text-muted mt-3">Datos del comercio</h6>
        <div class="mb-3">
            <input type="text" name="comercio.nombre" class="form-control"
                   placeholder="Nombre del comercio"
                   th:value="${reporte.comercio.nombre}">
        </div>
        <div class="mb-3">
            <input type="text" name="comercio.direccion" class="form-control"
                   placeholder="Direccion"
                   th:value="${reporte.comercio.direccion}">
        </div>
        <div class="mb-3">
            <select name="comercio.localidad" class="form-select">
                <option value="">Seleccionar partido/localidad</option>
                <option value="Almirante Brown"        th:selected="${reporte.comercio.localidad == 'Almirante Brown'}">Almirante Brown</option>
                <option value="Avellaneda"             th:selected="${reporte.comercio.localidad == 'Avellaneda'}">Avellaneda</option>
                <option value="Bahia Blanca"           th:selected="${reporte.comercio.localidad == 'Bahia Blanca'}">Bahía Blanca</option>
                <option value="Berazategui"            th:selected="${reporte.comercio.localidad == 'Berazategui'}">Berazategui</option>
                <option value="Berisso"                th:selected="${reporte.comercio.localidad == 'Berisso'}">Berisso</option>
                <option value="Brandsen"               th:selected="${reporte.comercio.localidad == 'Brandsen'}">Brandsen</option>
                <option value="Buenos Aires"           th:selected="${reporte.comercio.localidad == 'Buenos Aires'}">Buenos Aires (CABA)</option>
                <option value="Campana"                th:selected="${reporte.comercio.localidad == 'Campana'}">Campana</option>
                <option value="Canuelas"               th:selected="${reporte.comercio.localidad == 'Canuelas'}">Cañuelas</option>
                <option value="Ensenada"               th:selected="${reporte.comercio.localidad == 'Ensenada'}">Ensenada</option>
                <option value="Escobar"                th:selected="${reporte.comercio.localidad == 'Escobar'}">Escobar</option>
                <option value="Esteban Echeverria"     th:selected="${reporte.comercio.localidad == 'Esteban Echeverria'}">Esteban Echeverría</option>
                <option value="Exaltacion de la Cruz"  th:selected="${reporte.comercio.localidad == 'Exaltacion de la Cruz'}">Exaltación de la Cruz</option>
                <option value="Ezeiza"                 th:selected="${reporte.comercio.localidad == 'Ezeiza'}">Ezeiza</option>
                <option value="Florencio Varela"       th:selected="${reporte.comercio.localidad == 'Florencio Varela'}">Florencio Varela</option>
                <option value="General Las Heras"      th:selected="${reporte.comercio.localidad == 'General Las Heras'}">General Las Heras</option>
                <option value="General Rodriguez"      th:selected="${reporte.comercio.localidad == 'General Rodriguez'}">General Rodríguez</option>
                <option value="Hurlingham"             th:selected="${reporte.comercio.localidad == 'Hurlingham'}">Hurlingham</option>
                <option value="Ituzaingo"              th:selected="${reporte.comercio.localidad == 'Ituzaingo'}">Ituzaingó</option>
                <option value="Jose C. Paz"            th:selected="${reporte.comercio.localidad == 'Jose C. Paz'}">José C. Paz</option>
                <option value="La Matanza"             th:selected="${reporte.comercio.localidad == 'La Matanza'}">La Matanza</option>
                <option value="La Plata"               th:selected="${reporte.comercio.localidad == 'La Plata'}">La Plata</option>
                <option value="Lanus"                  th:selected="${reporte.comercio.localidad == 'Lanus'}">Lanús</option>
                <option value="Lobos"                  th:selected="${reporte.comercio.localidad == 'Lobos'}">Lobos</option>
                <option value="Lomas de Zamora"        th:selected="${reporte.comercio.localidad == 'Lomas de Zamora'}">Lomas de Zamora</option>
                <option value="Lujan"                  th:selected="${reporte.comercio.localidad == 'Lujan'}">Luján</option>
                <option value="Magdalena"              th:selected="${reporte.comercio.localidad == 'Magdalena'}">Magdalena</option>
                <option value="Malvinas Argentinas"    th:selected="${reporte.comercio.localidad == 'Malvinas Argentinas'}">Malvinas Argentinas</option>
                <option value="Mar del Plata"          th:selected="${reporte.comercio.localidad == 'Mar del Plata'}">Mar del Plata</option>
                <option value="Marcos Paz"             th:selected="${reporte.comercio.localidad == 'Marcos Paz'}">Marcos Paz</option>
                <option value="Merlo"                  th:selected="${reporte.comercio.localidad == 'Merlo'}">Merlo</option>
                <option value="Moreno"                 th:selected="${reporte.comercio.localidad == 'Moreno'}">Moreno</option>
                <option value="Moron"                  th:selected="${reporte.comercio.localidad == 'Moron'}">Morón</option>
                <option value="Navarro"                th:selected="${reporte.comercio.localidad == 'Navarro'}">Navarro</option>
                <option value="Pilar"                  th:selected="${reporte.comercio.localidad == 'Pilar'}">Pilar</option>
                <option value="Presidente Peron"       th:selected="${reporte.comercio.localidad == 'Presidente Peron'}">Presidente Perón</option>
                <option value="Punta Indio"            th:selected="${reporte.comercio.localidad == 'Punta Indio'}">Punta Indio</option>
                <option value="Quilmes"                th:selected="${reporte.comercio.localidad == 'Quilmes'}">Quilmes</option>
                <option value="Ramallo"                th:selected="${reporte.comercio.localidad == 'Ramallo'}">Ramallo</option>
                <option value="San Fernando"           th:selected="${reporte.comercio.localidad == 'San Fernando'}">San Fernando</option>
                <option value="San Isidro"             th:selected="${reporte.comercio.localidad == 'San Isidro'}">San Isidro</option>
                <option value="San Martin"             th:selected="${reporte.comercio.localidad == 'San Martin'}">San Martín</option>
                <option value="San Miguel"             th:selected="${reporte.comercio.localidad == 'San Miguel'}">San Miguel</option>
                <option value="San Nicolas"            th:selected="${reporte.comercio.localidad == 'San Nicolas'}">San Nicolás</option>
                <option value="San Vicente"            th:selected="${reporte.comercio.localidad == 'San Vicente'}">San Vicente</option>
                <option value="Tigre"                  th:selected="${reporte.comercio.localidad == 'Tigre'}">Tigre</option>
                <option value="Tres de Febrero"        th:selected="${reporte.comercio.localidad == 'Tres de Febrero'}">Tres de Febrero</option>
                <option value="Vicente Lopez"          th:selected="${reporte.comercio.localidad == 'Vicente Lopez'}">Vicente López</option>
                <option value="Zarate"                 th:selected="${reporte.comercio.localidad == 'Zarate'}">Zárate</option>
            </select>
        </div>

        <h6 class="text-muted mt-3">Precio</h6>
        <div class="mb-3">
            <input type="number" step="0.01" name="precio" class="form-control"
                   placeholder="Precio"
                   th:value="${reporte.precio}">
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> Guardar cambios
            </button>
            <a th:href="@{/reporte/mis-reportes}" class="btn btn-outline-secondary">Cancelar</a>
        </div>

        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
