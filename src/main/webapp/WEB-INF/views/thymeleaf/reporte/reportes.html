<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <h2>Resultados de precios</h2>
    <a th:href="@{/reporte}" class="btn btn-outline-secondary mb-3">Volver</a>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <table class="table table-bordered mt-2">
        <thead class="table-dark">
        <tr>
            <th>Producto</th>
            <th>Comercio</th>
            <th>Precio</th>
            <th>Fecha</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reporte : ${reportes}">
            <td th:text="${reporte.producto.nombre}"></td>
            <td th:text="${reporte.comercio.nombre}"></td>
            <td th:text="${reporte.precio}"></td>
            <td th:text="${#temporals.format(reporte.fechaDeReporte, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
                <form th:action="@{/reporte/{id}/dudoso(id=${reporte.id})}" method="post">
                    <input type="hidden" name="nombreProducto" th:value="${reporte.producto.nombre}">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Marcar dudoso</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
