<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reportes de precios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <h2 id="titulo-pagina">Reporta el precio del producto para ayudar a tus vecinos</h2>

    <!-- Botones cargar solo para no-COMERCIO -->
    <div th:if="${comercioDelUsuario == null}" class="d-flex gap-2 mt-3 mb-4">
        <a th:href="@{/reporte}" class="btn btn-primary">
            <i class="bi bi-pencil-square"></i> Cargar manualmente
        </a>
        <a th:href="@{/reporte/ticket}" class="btn btn-outline-primary">
            <i class="bi bi-receipt"></i> Cargar por ticket
        </a>
    </div>

    <h4 class="mt-5">Cargar precio</h4>
    <form th:action="@{/reporte}" method="post" class="mt-3">
        <h6 class="text-muted mt-3">Foto del producto</h6>

        <div class="mb-3">
            <input type="file"
                   id="foto"
                   class="form-control"
                   accept="image/*">
            <input type="hidden" name="fotoBase64" id="foto-base64">
        </div>

        <!-- Modal del recortador -->
        <div class="modal fade" id="modalCropper" tabindex="-1" data-bs-backdrop="static">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Recortar foto</h5>
                    </div>
                    <div class="modal-body" style="max-height: 60vh; overflow: hidden;">
                        <img id="imagen-a-recortar" src="" alt="Foto a recortar"
                             style="max-width: 100%; display: block;">
                    </div>
                    <div class="modal-footer d-flex justify-content-between align-items-center">
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-outline-secondary" id="btn-rotar-izq"
                                    title="Rotar 90° izquierda">
                                <i class="bi bi-arrow-counterclockwise"></i> -90°
                            </button>
                            <button type="button" class="btn btn-outline-secondary" id="btn-rotar-der"
                                    title="Rotar 90° derecha">
                                <i class="bi bi-arrow-clockwise"></i> +90°
                            </button>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-outline-danger" id="btn-cancelar-crop">
                                Cancelar
                            </button>
                            <button type="button" class="btn btn-primary" id="btn-confirmar-crop">
                                <i class="bi bi-check-lg"></i> Usar foto
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="preview-foto" class="mt-2" style="display: none;">
            <img id="img-preview" src="" alt="Vista previa"
                 style="max-height: 150px; border-radius: 8px; border: 1px solid #dee2e6;">
            <br>
            <button type="button" class="btn btn-sm btn-outline-secondary mt-1" id="btn-cambiar-foto">
                <i class="bi bi-pencil"></i> Cambiar foto
            </button>
        </div>

        <h6 class="text-muted mt-3">Datos del producto</h6>
        <div class="mb-3">
            <input type="text" name="producto.nombre" id="producto-nombre" class="form-control" placeholder="Nombre del producto" list="lista-productos" autocomplete="off">
            <datalist id="lista-productos">
                <option th:each="p : ${productos}" th:value="${p.nombre}"></option>
            </datalist>
        </div>
        <div class="mb-3">
            <input type="text" name="producto.marca" id="producto-marca" class="form-control" placeholder="Marca" list="lista-marcas" autocomplete="off">
            <datalist id="lista-marcas">
                <option th:each="p : ${productos}" th:value="${p.marca}"></option>
            </datalist>
        </div>
        <div class="mb-3">
            <select name="producto.categoria" id="producto-categoria" class="form-select">
                <option value="">Seleccionar categoria</option>
                <option value="Almacen">Almacén</option>
                <option value="Bebidas con alcohol">Bebidas con alcohol</option>
                <option value="Bebidas sin alcohol">Bebidas sin alcohol</option>
                <option value="Carnes y aves">Carnes y aves</option>
                <option value="Cereales y legumbres">Cereales y legumbres</option>
                <option value="Condimentos y salsas">Condimentos y salsas</option>
                <option value="Congelados">Congelados</option>
                <option value="Enlatados y conservas">Enlatados y conservas</option>
                <option value="Farmacia y perfumeria">Farmacia y perfumería</option>
                <option value="Ferreteria y bazar">Ferretería y bazar</option>
                <option value="Fiambres y embutidos">Fiambres y embutidos</option>
                <option value="Higiene personal">Higiene personal</option>
                <option value="Lacteos">Lácteos</option>
                <option value="Limpieza del hogar">Limpieza del hogar</option>
                <option value="Mascotas">Mascotas</option>
                <option value="Panaderia y reposteria">Panadería y repostería</option>
                <option value="Pescados y mariscos">Pescados y mariscos</option>
                <option value="Productos de dietetica">Productos de dietética</option>
                <option value="Snacks y golosinas">Snacks y golosinas</option>
                <option value="Tabaco">Tabaco</option>
                <option value="Verduras y frutas">Verduras y frutas</option>
            </select>
        </div>
        <div class="mb-3">
            <input type="text" name="producto.unidad" id="producto-unidad" class="form-control" placeholder="Unidad (ej: 1kg, 900ml)">
        </div>

        <h6 class="text-muted mt-3">Datos del comercio</h6>

        <!-- COMERCIO: campos fijos (solo lectura) + hidden fields -->
        <div th:if="${comercioDelUsuario != null}">
            <div class="mb-3">
                <input type="text"
                       class="form-control"
                       th:value="${comercioDelUsuario.nombre}"
                       readonly>
                <input type="hidden" name="comercio.nombre" th:value="${comercioDelUsuario.nombre}">
            </div>
            <div class="mb-3">
                <input type="text"
                       class="form-control"
                       th:value="${comercioDelUsuario.direccion}"
                       readonly>
                <input type="hidden" name="comercio.direccion" th:value="${comercioDelUsuario.direccion}">
            </div>
            <div class="mb-3">
                <input type="text"
                       class="form-control"
                       th:value="${comercioDelUsuario.localidad}"
                       readonly>
                <input type="hidden" name="comercio.localidad" th:value="${comercioDelUsuario.localidad}">
            </div>
        </div>

        <!-- Otros roles: campos editables -->
        <div th:if="${comercioDelUsuario == null}">
            <div class="mb-3">
                <input type="text" name="comercio.nombre" id="comercio-nombre" class="form-control" placeholder="Nombre del comercio" list="lista-comercios" autocomplete="off">
                <datalist id="lista-comercios">
                    <option th:each="c : ${comercios}" th:value="${c.nombre}"></option>
                </datalist>
            </div>
            <div class="mb-3">
                <input type="text" name="comercio.direccion" id="comercio-direccion" class="form-control" placeholder="Direccion" list="lista-direcciones" autocomplete="off">
                <datalist id="lista-direcciones">
                    <option th:each="c : ${comercios}" th:value="${c.direccion}"></option>
                </datalist>
            </div>
            <div class="mb-3">
                <select name="comercio.localidad" id="comercio-localidad" class="form-select">
                    <option value="">Seleccionar partido/localidad</option>
                    <option value="Almirante Brown">Almirante Brown</option>
                    <option value="Avellaneda">Avellaneda</option>
                    <option value="Bahia Blanca">Bahía Blanca</option>
                    <option value="Berazategui">Berazategui</option>
                    <option value="Berisso">Berisso</option>
                    <option value="Brandsen">Brandsen</option>
                    <option value="Buenos Aires">Buenos Aires (CABA)</option>
                    <option value="Campana">Campana</option>
                    <option value="Canuelas">Cañuelas</option>
                    <option value="Ensenada">Ensenada</option>
                    <option value="Escobar">Escobar</option>
                    <option value="Esteban Echeverria">Esteban Echeverría</option>
                    <option value="Exaltacion de la Cruz">Exaltación de la Cruz</option>
                    <option value="Ezeiza">Ezeiza</option>
                    <option value="Florencio Varela">Florencio Varela</option>
                    <option value="General Las Heras">General Las Heras</option>
                    <option value="General Rodriguez">General Rodríguez</option>
                    <option value="Hurlingham">Hurlingham</option>
                    <option value="Ituzaingo">Ituzaingó</option>
                    <option value="Jose C. Paz">José C. Paz</option>
                    <option value="La Matanza">La Matanza</option>
                    <option value="La Plata">La Plata</option>
                    <option value="Lanus">Lanús</option>
                    <option value="Lobos">Lobos</option>
                    <option value="Lomas de Zamora">Lomas de Zamora</option>
                    <option value="Lujan">Luján</option>
                    <option value="Magdalena">Magdalena</option>
                    <option value="Malvinas Argentinas">Malvinas Argentinas</option>
                    <option value="Mar del Plata">Mar del Plata</option>
                    <option value="Marcos Paz">Marcos Paz</option>
                    <option value="Merlo">Merlo</option>
                    <option value="Moreno">Moreno</option>
                    <option value="Moron">Morón</option>
                    <option value="Navarro">Navarro</option>
                    <option value="Pilar">Pilar</option>
                    <option value="Presidente Peron">Presidente Perón</option>
                    <option value="Punta Indio">Punta Indio</option>
                    <option value="Quilmes">Quilmes</option>
                    <option value="Ramallo">Ramallo</option>
                    <option value="San Fernando">San Fernando</option>
                    <option value="San Isidro">San Isidro</option>
                    <option value="San Martin">San Martín</option>
                    <option value="San Miguel">San Miguel</option>
                    <option value="San Nicolas">San Nicolás</option>
                    <option value="San Vicente">San Vicente</option>
                    <option value="Tigre">Tigre</option>
                    <option value="Tres de Febrero">Tres de Febrero</option>
                    <option value="Vicente Lopez">Vicente López</option>
                    <option value="Zarate">Zárate</option>
                </select>
            </div>
            <div class="mb-3">
                <button type="button" id="btn-buscar-ubicacion-reporte" class="btn btn-outline-primary btn-sm"
                        th:attr="data-url=@{/reporte/ubicaciones/sugerencias}">
                    <i class="bi bi-geo-alt"></i> Buscar en el mapa
                </button>
                <p id="estado-ubicacion-reporte" class="small text-muted mt-2 mb-2" role="status" aria-live="polite">
                    Opcional: ubicá el local en el mapa para que otros vecinos lo encuentren.
                </p>
                <div id="sugerencias-ubicacion-reporte" class="list-group mb-2"></div>
                <div id="mapa-ubicacion-reporte" class="rounded border d-none" style="height: 260px;"
                     role="application" aria-label="Mapa para ubicar el comercio"></div>
                <input type="hidden" name="comercio.latitud" id="comercio-latitud">
                <input type="hidden" name="comercio.longitud" id="comercio-longitud">
            </div>
        </div>

        <h6 class="text-muted mt-3">Precio</h6>
        <div class="mb-3">
            <input type="number" step="0.01" name="precio" id="precio" class="form-control" placeholder="Precio">
        </div>
        <button type="submit" id="btn-guardar-reporte" class="btn btn-primary">Guardar reporte</button>
    </form>
    <div th:if="${guardado}" id="alerta-reporte-guardado" class="alert alert-success mt-3" role="alert">
        ¡Reporte guardado con éxito!
    </div>
    <div th:if="${error}" id="error" class="alert alert-danger mt-3" th:text="${error}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var cropper = null;
    var modalCropper = new bootstrap.Modal(document.getElementById('modalCropper'));
    var fotoBase64Recortada = null;

    document.getElementById('foto').addEventListener('change', function() {
        if (!this.files.length) return;
        var file = this.files[0];
        var reader = new FileReader();
        reader.onload = function(e) {
            var imgEl = document.getElementById('imagen-a-recortar');
            imgEl.src = e.target.result;
            if (cropper) { cropper.destroy(); cropper = null; }
            modalCropper.show();
            document.getElementById('modalCropper').addEventListener('shown.bs.modal', function init() {
                cropper = new Cropper(imgEl, {
                    aspectRatio: NaN,
                    viewMode: 1,
                    autoCropArea: 0.8,
                    responsive: true,
                    restore: false
                });
                document.getElementById('modalCropper').removeEventListener('shown.bs.modal', init);
            });
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('btn-rotar-izq').addEventListener('click', function() {
        if (cropper) cropper.rotate(-90);
    });
    document.getElementById('btn-rotar-der').addEventListener('click', function() {
        if (cropper) cropper.rotate(90);
    });

    document.getElementById('btn-confirmar-crop').addEventListener('click', function() {
        if (!cropper) return;
        var canvas = cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200, imageSmoothingQuality: 'high' });
        fotoBase64Recortada = canvas.toDataURL('image/jpeg', 0.85);
        document.getElementById('foto-base64').value = fotoBase64Recortada;
        document.getElementById('img-preview').src = fotoBase64Recortada;
        document.getElementById('preview-foto').style.display = 'block';
        modalCropper.hide();
        fetch('/reporte/ticket/reconocer-producto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'imagenBase64=' + encodeURIComponent(fotoBase64Recortada)
        })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) return;
                if (data.nombre) document.getElementById('producto-nombre').value = data.nombre;
                if (data.marca)  document.getElementById('producto-marca').value = data.marca;
                if (data.unidad) document.getElementById('producto-unidad').value = data.unidad;
                if (data.categoria) {
                    var sel = document.getElementById('producto-categoria');
                    for (var i = 0; i < sel.options.length; i++) {
                        if (sel.options[i].value === data.categoria) { sel.selectedIndex = i; break; }
                    }
                }
            })
            .catch(function() {});
    });

    document.getElementById('btn-cancelar-crop').addEventListener('click', function() {
        document.getElementById('foto').value = '';
        fotoBase64Recortada = null;
        document.getElementById('foto-base64').value = '';
        document.getElementById('preview-foto').style.display = 'none';
        modalCropper.hide();
    });

    document.getElementById('btn-cambiar-foto').addEventListener('click', function() {
        document.getElementById('foto').value = '';
        fotoBase64Recortada = null;
        document.getElementById('foto-base64').value = '';
        document.getElementById('preview-foto').style.display = 'none';
        document.getElementById('foto').click();
    });

    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        var formulario = this;

        var inputs = this.querySelectorAll('input[type="text"]');
        inputs.forEach(function(input) { input.value = input.value.trim(); });

        var errores = [];
        if (!document.getElementById('producto-nombre').value) errores.push('Nombre del producto');
        if (!document.getElementById('producto-marca').value) errores.push('Marca');
        if (!document.getElementById('producto-categoria').value) errores.push('Categoría');
        if (!document.getElementById('producto-unidad').value) errores.push('Unidad');

        // Validar comercio solo si los campos existen (no COMERCIO role)
        var campoComercioNombre = document.getElementById('comercio-nombre');
        var campoComercioDir = document.getElementById('comercio-direccion');
        var campoComercioLoc = document.getElementById('comercio-localidad');
        if (campoComercioNombre && !campoComercioNombre.value) errores.push('Nombre del comercio');
        if (campoComercioDir && !campoComercioDir.value) errores.push('Dirección');
        if (campoComercioLoc && !campoComercioLoc.value) errores.push('Localidad');

        if (!document.getElementById('precio').value || parseFloat(document.getElementById('precio').value) <= 0) errores.push('Precio');

        if (errores.length > 0) {
            var errorDiv = document.getElementById('error');
            if (!errorDiv) {
                errorDiv = document.createElement('div');
                errorDiv.id = 'error';
                errorDiv.className = 'alert alert-danger mt-3';
                formulario.parentNode.insertBefore(errorDiv, formulario.nextSibling);
            }
            errorDiv.textContent = 'Completá los siguientes campos: ' + errores.join(', ');
            errorDiv.style.display = 'block';
            return;
        }

        var errorDiv = document.getElementById('error');
        if (errorDiv) errorDiv.style.display = 'none';

        if (fotoBase64Recortada) { formulario.submit(); return; }

        var foto = document.getElementById('foto');
        if (!foto.files.length) { formulario.submit(); return; }

        var lector = new FileReader();
        lector.onload = function(evento) {
            document.getElementById('foto-base64').value = evento.target.result;
            formulario.submit();
        };
        lector.readAsDataURL(foto.files[0]);
    });
</script>
<script>
    // "Buscar en el mapa": el vecino confirma dónde está el local antes de reportar.
    // Es opcional: si no lo usa, el servidor ubica el comercio con la dirección escrita.
    (function () {
        const boton = document.getElementById('btn-buscar-ubicacion-reporte');
        if (!boton || typeof L === 'undefined') return;

        const contenedor = document.getElementById('mapa-ubicacion-reporte');
        const estado = document.getElementById('estado-ubicacion-reporte');
        const lista = document.getElementById('sugerencias-ubicacion-reporte');
        const campoDireccion = document.getElementById('comercio-direccion');
        const campoLocalidad = document.getElementById('comercio-localidad');
        const campoLatitud = document.getElementById('comercio-latitud');
        const campoLongitud = document.getElementById('comercio-longitud');
        const centroAmba = [-34.6037, -58.3816];

        let mapa = null;
        let marcador = null;

        function confirmar(latitud, longitud) {
            campoLatitud.value = latitud.toFixed(7);
            campoLongitud.value = longitud.toFixed(7);
        }

        // El mapa se crea recién al buscar: Leaflet necesita que su contenedor sea visible
        function asegurarMapa() {
            if (mapa) return;
            contenedor.classList.remove('d-none');
            mapa = L.map(contenedor).setView(centroAmba, 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; colaboradores de OpenStreetMap'
            }).addTo(mapa);
            mapa.on('click', function (evento) {
                ponerMarcador(evento.latlng.lat, evento.latlng.lng, false);
                estado.textContent = 'Marcaste la ubicación a mano.';
            });
        }

        function ponerMarcador(latitud, longitud, acercar) {
            asegurarMapa();
            if (marcador) {
                marcador.setLatLng([latitud, longitud]);
            } else {
                marcador = L.marker([latitud, longitud], { draggable: true, title: 'El local' }).addTo(mapa);
                marcador.on('dragend', function () {
                    const posicion = marcador.getLatLng();
                    confirmar(posicion.lat, posicion.lng);
                    estado.textContent = 'Ubicación ajustada.';
                });
            }
            if (acercar) mapa.setView([latitud, longitud], 17);
            confirmar(latitud, longitud);
        }

        function marcarElegida(elegido) {
            lista.querySelectorAll('button').forEach(function (item) {
                item.classList.toggle('active', item === elegido);
                item.setAttribute('aria-pressed', item === elegido ? 'true' : 'false');
            });
        }

        // Al elegir una opción, la dirección se reemplaza por el nombre oficial de la calle
        function elegir(item, sugerencia) {
            marcarElegida(item);
            if (sugerencia.direccion) campoDireccion.value = sugerencia.direccion;
            ponerMarcador(sugerencia.latitud, sugerencia.longitud, true);
        }

        function mostrarSugerencias(sugerencias) {
            lista.replaceChildren();
            sugerencias.forEach(function (sugerencia, indice) {
                const item = document.createElement('button');
                item.type = 'button';
                item.id = 'opcion-ubicacion-reporte-' + indice;
                item.className = 'list-group-item list-group-item-action';
                item.setAttribute('aria-pressed', 'false');
                // textContent y no innerHTML: el texto viene de un servicio externo
                item.textContent = sugerencia.nomenclatura;
                item.addEventListener('click', function () {
                    elegir(item, sugerencia);
                    estado.textContent = 'Elegiste: ' + sugerencia.nomenclatura + '.';
                });
                lista.appendChild(item);
                if (indice === 0) elegir(item, sugerencia);
            });
        }

        // La ubicación confirmada vale para la dirección escrita: si la cambian, se descarta
        function descartarConfirmacion() {
            if (!campoLatitud.value) return;
            campoLatitud.value = '';
            campoLongitud.value = '';
            lista.replaceChildren();
            if (marcador) {
                mapa.removeLayer(marcador);
                marcador = null;
            }
            estado.textContent = 'Cambiaste la dirección: tocá "Buscar en el mapa" para ubicarla de nuevo.';
        }
        campoDireccion.addEventListener('input', descartarConfirmacion);
        campoLocalidad.addEventListener('change', descartarConfirmacion);

        boton.addEventListener('click', function () {
            const direccion = campoDireccion.value.trim();
            if (!direccion) {
                estado.textContent = 'Escribí la dirección del local antes de buscarla.';
                campoDireccion.focus();
                return;
            }
            const url = boton.dataset.url + '?direccion=' + encodeURIComponent(direccion)
                + '&localidad=' + encodeURIComponent(campoLocalidad.value);
            boton.disabled = true;
            estado.textContent = 'Buscando la dirección...';
            fetch(url, { headers: { 'Accept': 'application/json' } })
                .then(function (respuesta) {
                    if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
                    return respuesta.json();
                })
                .then(function (sugerencias) {
                    if (sugerencias.length === 0) {
                        lista.replaceChildren();
                        asegurarMapa();
                        estado.textContent = 'No encontramos esa dirección. Revisala, o tocá el mapa donde está el local.';
                        return;
                    }
                    mostrarSugerencias(sugerencias);
                    estado.textContent = sugerencias.length === 1
                        ? 'Encontramos la dirección. Si el marcador no quedó justo, arrastralo.'
                        : 'Encontramos ' + sugerencias.length + ' opciones: elegí la del local.';
                })
                .catch(function () {
                    asegurarMapa();
                    estado.textContent = 'No pudimos buscar la dirección ahora. Podés reportar igual o tocar el mapa donde está el local.';
                })
                .finally(function () {
                    boton.disabled = false;
                });
        });
    })();
</script>
