<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{navbar :: navbar}"></nav>
<div class="container mt-4">
    <h2>Mis productos</h2>
    <p class="text-muted">Los productos que publicaste en tu comercio.</p>
    <hr>

    <div th:if="${#lists.isEmpty(reportes)}" class="alert alert-info mt-3">
        Todavía no publicaste ningún producto.
    </div>

    <div th:if="${not #lists.isEmpty(reportes)}" class="row row-cols-1 row-cols-md-3 g-4 mt-2">
        <div class="col" th:each="reporte : ${reportes}">
            <div class="card h-100 shadow-sm" th:id="'card-mi-producto-' + ${reporte.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${reporte.producto.nombre}"></h5>
                    <p class="card-text text-muted mb-1">
                        <span th:text="${reporte.producto.marca}"></span> ·
                        <span th:text="${reporte.producto.unidad}"></span>
                    </p>
                    <p class="card-text fw-bold text-success">
                        $<span th:text="${reporte.precio}"></span>
                    </p>
                    <p class="card-text text-muted small"
                       th:text="${#temporals.format(reporte.fechaDeReporte, 'dd/MM/yyyy')}">
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
